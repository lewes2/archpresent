e:\"steer\"|\"followUp\"}","l":"only while isStreaming","s":"—","d":"Which of the two a plain Enter sends is a PREFERENCE (streamingMessageBehavior) — steer interrupts the current turn, follow-up queues after it, and getting it backwards is the single most confusing thing a new operator hits"}]},{"id":"EDITORPANEL","n":"EditorPanel.vue","t":"3628 lines · 251 bindings","k":"risk","col":1,"row":0,"d":"RISK — 251 bindings hosting Monaco. It owns the file tree, tabs, dirty tracking, the diff viewer (inline and split), multi-file diff navigation, the HTML preview iframe, image preview, search, and recent files. It is large for the same reason an IDE panel is large; the honest split would be \"editor\" vs \"diff viewer\", which today share tab state.","in":[{"n":"file content","t":"GET /api/files/read → {content, encoding, truncated?}","l":"binary types refused by extension before reading","s":"the operator's disk","d":"A 44-entry binary extension list stops Monaco from being handed a .zip as UTF-8 — the check is on the server, mirrored here only for the icon"},{"n":"diff request","t":"GET /api/git/diff?cwd=&scope=all|staged|unstaged","l":"256 KiB cap, enforced server-side","s":"—","d":"Over the cap the server refuses rather than truncating, and this panel shows the refusal — an operator must never review a silently clipped diff"}],"out":[{"n":"save","t":"POST /api/files/write {path, content}","l":"one write per save, no autosave","s":"the real file","d":"There is no optimistic locking: a file changed on disk by the agent while open here is overwritten by a save, which is why the panel re-reads on tab focus"},{"n":"preview","t":"iframe → /api/files/preview-asset","l":"CSS, fonts, icons and images only","s":"—","d":"The asset MIME allow-list is wider than the image one specifically so an HTML preview can load its stylesheet without opening arbitrary types under the app origin"}]},{"id":"SIDEBAR","n":"SessionSidebar.vue","t":"1959 lines · 133 bindings","k":"risk","col":2,"row":0,"d":"RISK — 133 bindings. It lists sessions across projects and review sources, groups and filters them, shows per-session streaming and worktree badges, handles rename/delete, project switching and the project picker. Its weight comes from serving three different session kinds (live Pi sessions, worktree sessions, imported review transcripts) through one list.","in":[{"n":"session list","t":"SessionInfo[] from GET /api/sessions","l":"server-side cache 2,000 ms","s":"—","d":"messageCount is USER turns only; the sidebar is the reason that count exists at all, and the reason each JSONL file gets streamed and memoised on mtimeMs"},{"n":"streaming flags","t":"session-streaming events from useChat","l":"one per session state change","s":"—","d":"A session streaming in another tab shows no badge here — isStreaming is per-tab client state, not a server broadcast"}],"out":[{"n":"select session","t":"@select-session(sessionId)","l":"—","s":"router /sessions/:id","d":"Selection drives the ROUTE, so a chosen session survives a reload and can be linked to"}]},{"id":"BUBBLE","n":"MessageBubble.vue","t":"2150 lines · 109 bindings","k":"risk","col":3,"row":0,"d":"RISK — 109 bindings for one list row, because a row can be any of six things: markdown text, a thinking block, a tool call, a tool result, a status line, or a memory-recall disclosure. It also renders Mermaid, highlights code, links inline git SHAs to the diff viewer, and sanitises everything through DOMPurify.","in":[{"n":"message","t":"Message{id,role,content,thinking?,kind,status,title?,toolName?,toolInput?,toolOutput?,usage?,images?,memory?}","l":"one per row","s":"—","d":"usage carries per-message token and cost figures, which is why the row and not the panel owns the cost display"},{"n":"markdown","t":"model-authored text","l":"marked → DOMPurify → v-html","s":"—","d":"Sanitisation is mandatory here: this is untrusted model output being injected as HTML, and the CSP alone would not stop an injected inline handler"}],"out":[{"n":"open commit","t":"click on a 7–40 hex SHA → diff view","l":"—","s":"—","d":"Inline SHAs are linked so a \"I committed X\" message is one click from the diff — the feature that makes the transcript navigable after the fact"}]},{"id":"SETTINGS","n":"SettingsDialog.vue","t":"2231 lines · 99 bindings","k":"risk","col":4,"row":0,"d":"RISK — 99 bindings because it is seven settings surfaces in one dialog: appearance and locale, sound notifications, agent profiles and models, API keys, proxies, git hosting credentials, gateway configuration, and the commit-message prompt pair. Each is small; the aggregate is not.","in":[{"n":"current settings","t":"GET /api/auth/preferences · /api/sessions/agent-profiles/:id/* · /api/git-hosting/settings · /api/gateways/settings","l":"loaded lazily per tab of the dialog","s":"security_settings + agent_profile_settings","d":"Credentials are never returned in full — the dialog shows presence, not the token, so a screenshot of settings does not leak a PAT"}],"out":[{"n":"save","t":"PATCH /preferences · PUT /agent-profiles/:id/api-key · POST /git-hosting/settings …","l":"one call per section","s":"—","d":"Proxy settings have an explicit /proxy/check endpoint that curls https://www.google.com/generate_204 with a 5 s connect / 10 s total timeout — saving an unreachable proxy would otherwise only fail at the next model call"}]},{"id":"MEMORYUI","n":"MemoryCenter.vue","t":"1688 lines · 80 bindings","k":"comp","col":5,"row":0,"d":"The review desk for everything the extraction pipeline produced: browse by scope and category, approve or reject pending global memories, edit with optimistic concurrency, undo a whole extraction batch, and inspect failed runs. Exactly at the 80-binding ceiling, so it stands alone.","in":[{"n":"memory list","t":"GET /api/memories?scope=&category=&status=","l":"paged","s":"memories table","d":"Pending is the default filter for global scope — the queue of things awaiting a human decision is the point of the screen"},{"n":"push update","t":"memory_updated frame over the chat socket","l":"one per completed run","s":"—","d":"Filtered server-side by agent profile, so a second profile's extraction never flickers this list"}],"out":[{"n":"edit","t":"PATCH /api/memories/:id {content?,category?,tags?,pinned?,pinnedApplicability?, expectedRevision}","l":"optimistic concurrency on revision","s":"—","d":"A revision mismatch is surfaced as a conflict rather than silently retried — the agent may have rewritten the same memory between load and save"},{"n":"batch undo","t":"POST /api/memories/batches/:id/undo","l":"one extraction run per batch","s":"—","d":"The unit of regret is the RUN, not the memory: a bad extraction usually produces several bad memories together"}]},{"id":"TASKQ","n":"TaskQueuePanel.vue","t":"1152 lines · 58 bindings","k":"comp","col":6,"row":0,"d":"The per-project queue view: reorder, start, complete, delete, and see which task became which session. Starting a task does NOT send its prompt — the panel receives the prompt back and submits it through the normal chat path, so the first turn streams into the transcript like any other.","in":[{"n":"task list","t":"GET /api/tasks?projectPath=","l":"indexed on (project_path, status, created_at, id)","s":"project_tasks table","d":"Ordering is by creation, not priority — there is no priority column, and that is a deliberate simplification of a personal queue"}],"out":[{"n":"start","t":"POST /api/tasks/:id/start {clientId} → ProjectTaskStartResult","l":"one in-flight start per task (claimStart guards it)","s":"—","d":"The returned prompt is handed to useChat().sendMessage, which is why a queued task inherits the whole streaming, preflight and steer machinery for free"}]},{"id":"TASKED","n":"Task editor & skill picker","t":"TaskEditorDialog.vue + SkillPicker.vue · 2 files / 879 lines / 64 bindings","k":"comp","col":7,"row":0,"d":"Where a task's full launch recipe is assembled: prompt, notes, agent profile, model, skill mode or preset, and worktree options. /polish sends the draft prompt to the automation model to tighten it before queueing.","in":[{"n":"available skills","t":"GET /api/sessions/agent-profiles/:profileId/skills?cwd=","l":"cached per (profileId, cwd) in useLaunchResourceCache","s":"—","d":"Skills are profile- AND directory-scoped, so the picker must be re-fetched when either changes — the cache key is exactly that pair"}],"out":[{"n":"task draft","t":"{title,prompt,notes,agentProfileId,modelProvider,modelId,skillMode,skills[],presetId?,worktree}","l":"validated again at start time","s":"project_tasks row","d":"Validation is repeated at start because weeks can pass between queueing and running: a profile, model or skill may no longer exist"}]},{"id":"LAUNCH","n":"Session launch surfaces","t":"NewSessionDialog + SessionLaunchSettings + SessionTreeModal · 3 files / 1355 lines / 71 bindings","k":"comp","col":0,"row":1,"d":"The same launch matrix as the task editor, plus the session tree. The tree exists because Pi sessions branch: navigating to an earlier leaf forks the conversation rather than deleting the later turns.","in":[{"n":"launch options","t":"{cwd, profileId, model, skillMode|presetId, worktree:{mode,branchMode,branchName,baseBranch?,copyFile?}}","l":"one session per confirm","s":"session_skill_policies + session_worktrees","d":"copyFile is offered only from the repo root's gitignored files — carrying .env into a worktree is the case this exists for"},{"n":"tree","t":"GET /api/sessions/:id/tree","l":"—","s":"the session JSONL","d":"Leaf ids are what memory extraction uses as its baseline, so navigating the tree also moves what the next extraction will read"}],"out":[{"n":"navigate","t":"POST /api/sessions/:id/tree/navigate {leafId}","l":"—","s":"—","d":"Navigation rewrites the session's current leaf; the transcript is then reloaded from disk rather than patched in place"}]},{"id":"REPO","n":"Repository & folder pickers","t":"CloneRepositoryModal + FolderPickerModal · 2 files / 1255 lines / 77 bindings","k":"comp","col":1,"row":1,"d":"Both browse the server's filesystem, which is why both are constrained by the same allowed-roots check as everything else. The clone modal is the only place in the SPA that consumes Server-Sent Events instead of the chat socket.","in":[{"n":"clone progress","t":"EventSource /api/sessions/clone-repository/:jobId/events","l":"one job, cancellable","s":"—","d":"SSE rather than the chat socket so a clone survives a chat reconnect and does not compete with agent event frames"},{"n":"directory listing","t":"GET /api/files/tree?path=&filterType=directory","l":"symlinks reported with target type, not followed","s":"—","d":"A dangling symlink shows as targetType:\"missing\" rather than an empty folder, which is the difference between a confusing picker and a correct one"}],"out":[{"n":"chosen path","t":"string, absolute","l":"must pass resolveAllowedPath server-side on use","s":"—","d":"The picker cannot enforce the roots itself — it shows what the server returns, and the server re-checks on every subsequent use of the path"}]},{"id":"PROFILES","n":"Agent profiles & skill presets","t":"ProfileManagerDialog + SkillPresetsPanel · 2 files / 893 lines / 58 bindings","k":"comp","col":2,"row":1,"d":"An agent profile is a directory under ~/.pi — its own credentials, models, skills and proxy. This dialog creates, copies and deletes them; the presets panel names reusable skill sets so a launch does not mean ticking twenty checkboxes.","in":[{"n":"profiles","t":"GET /api/sessions/agent-profiles → AgentProfile{id,label,path,isDefault,defaultProvider?,defaultModel?,automationProvider?,automationModel?}","l":"one per directory in ~/.pi except \"agent\" (the default)","s":"~/.pi/<profileId>/","d":"Symlinked profile directories are followed and accepted — sharing one credential set across machines by symlink is a supported layout"},{"n":"preset","t":"{name, mode:\"enabled\"|\"disabled\", skills[]}","l":"UNIQUE(username, name)","s":"skill_presets table","d":"Deleting a preset SET NULLs it on any session policy that referenced it, so a running session keeps its resolved skills"}],"out":[{"n":"delete profile","t":"DELETE /api/sessions/agent-profiles/:profileId → {activeProfileChanged}","l":"—","s":"also deletes that profile's memories","d":"The response says whether the CURRENT client's profile changed, because the UI must then reload the model list and skill list it had cached"}]},{"id":"SECURITYUI","n":"Login & security panel","t":"LoginView + SecurityPanel · 2 files / 613 lines / 31 bindings","k":"comp","col":3,"row":1,"d":"The login screen replaces the entire app tree while unauthenticated, so no panel ever mounts against a 401. The security panel shows the audit log and drives TOTP enrolment.","in":[{"n":"login","t":"POST /api/auth/login {username,password,code?}","l":"5 failures / 15 min / IP","s":"—","d":"A blocked IP gets the same generic failure as a wrong password — the panel does not reveal that a block is in effect"},{"n":"audit","t":"GET /api/auth/audit → AuditEvent[]","l":"—","s":"audit_events table","d":"Includes origin rejections and terminal opens, not just logins — the panel is the only place those are visible"}],"out":[{"n":"enable 2FA","t":"POST /api/auth/2fa/setup → {qrCodeDataUrl}, then /2fa/enable {secret, code}","l":"—","s":"security_settings","d":"Two steps on purpose: the secret is only persisted once a valid code proves the authenticator actually holds it"}]},{"id":"SEARCHUI","n":"Search & mention menus","t":"SearchModal + FileSearchMenu + FileTreeNode + SlashCommandMenu · 4 files / 1147 lines / 39 bindings","k":"comp","col":4,"row":1,"d":"Three different searches that look similar and are not: full-text over session transcripts, fuzzy file matching for @-mentions, and the slash-command list. The fuzzy matcher is local (fileSearchService.fuzzyMatch) and scores consecutive matches quadratically, so \"usCh\" ranks useChat.ts above a scattered match.","in":[{"n":"file query","t":"string, or a glob like *.ts","l":"local scoring over the fetched candidate list","s":"—","d":"Glob queries take a different path from fuzzy ones — parseFileQuery branches on a leading \"*.\" because a glob must match exactly, not fuzzily"},{"n":"session search","t":"GET /api/sessions/search?q=","l":"searches allMessagesText","s":"—","d":"The server carries the whole message text into SessionInfo for this one feature, which is also why the list payload is large"}],"out":[{"n":"mention insert","t":"\"@path/to/file\" into the composer","l":"—","s":"recent files in localStorage, ≤20","d":"Recent files are ranked ahead of fresh matches, because the file you just edited is almost always the one you mean"}]},{"id":"PRIMITIVES","n":"UI primitives & modal shells","t":"CustomSelect + ConfirmModal + InputPromptModal + MemoryToast + DialogCloseButton · 5 files / 1285 lines / 64 bindings","k":"lib","col":5,"row":1,"d":"The shared vocabulary. CustomSelect is the heaviest (64 bindings across this group) because a native <select> could not do the searchable, grouped, keyboard-navigable model picker this app needs everywhere.","in":[{"n":"options","t":"{label, value, group?, disabled?}[]","l":"—","s":"—","d":"Grouping matters for the model picker: 30 providers × several models each is unusable as a flat list"},{"n":"toast","t":"MemoryRecallItem[] + token count","l":"auto-dismiss","s":"—","d":"The memory toast is how recall becomes visible at all — without it, injected context is invisible to the operator and impossible to debug"}],"out":[{"n":"confirm result","t":"Promise<boolean>","l":"—","s":"—","d":"Promise-based rather than event-based so a destructive action reads as a single awaited line at the call site"}]},{"id":"TERMINALUI","n":"TerminalPanel.vue","t":"546 lines · 16 bindings","k":"comp","col":6,"row":1,"d":"xterm.js plus the fit addon, one socket per terminal instance. Small because all the difficulty is on the server side; its one real job is to keep the pty's dimensions and the DOM's in sync.","in":[{"n":"output","t":"{type:\"output\", terminalId, data}","l":"streamed per pty chunk","s":"—","d":"Written straight into xterm without buffering — the terminal widget is the buffer"},{"n":"resize","t":"ResizeObserver → fit()","l":"sent as {type:\"resize\",terminalId,cols,rows}","s":"—","d":"A resize that does not reach the pty leaves the shell drawing to the wrong width; this is the one message the panel must not drop"}],"out":[{"n":"input","t":"{type:\"input\", terminalId, data}","l":"—","s":"—","d":"Keystrokes go to the pty raw, including control characters — this is a real shell, not a command runner"}]}],"links":[{"s":["SIDEBAR",0],"t":["CHATPANEL",0],"l":"selected session"},{"s":["CHATPANEL",0],"t":["BUBBLE",0],"l":"Message rows"},{"s":["BUBBLE",0],"t":["EDITORPANEL",1],"l":"open commit diff"},{"s":["SEARCHUI",0],"t":["CHATPANEL",0],"l":"@-mention insert"},{"s":["TASKQ",0],"t":["CHATPANEL",0],"l":"task prompt → chat"},{"s":["TASKED",0],"t":["TASKQ",0],"l":"queued task"},{"s":["LAUNCH",0],"t":["SIDEBAR",0],"l":"new session"},{"s":["PROFILES",0],"t":["SETTINGS",0],"l":"profile change"},{"s":["MEMORYUI",0],"t":["PRIMITIVES",1],"l":"recall toast"}]});
dia({"id":"L3-COMPOSABLES","lv":3,"parent":"L2-CLIENT","title":"Component · Stateful composables (composables/ · 19 files / 3852 lines)","sub":"Module-scope refs, not per-call state — calling one twice returns the same object, which is the entire state-management strategy","colw":252,"blocks":[{"id":"CHATSTATE","n":"Chat state machine","t":"useChat.ts · 1035 lines · 5 exports","k":"app","col":0,"row":0,"d":"1,035 lines translating the SDK's event stream into renderable rows. The hard part is not the translation, it is that the VIEWED session and the STREAMING session can differ: state is a record keyed by sessionId, so events for a background run keep landing while the operator reads something else.","in":[{"n":"event frame","t":"{type:\"event\", sessionId, event} · message_start | message_update{text_delta,thinking_delta,tool_*} | tool_execution_* | agent_start | agent_settled","l":"one per SDK event, unbounded per turn","s":"in-memory Record<sessionId, SessionChatState>","d":"Deltas append to currentMessage; an assistant message with neither text nor thinking is REMOVED on message_end, so a turn that only called tools leaves no empty bubble"},{"n":"disconnected","t":"socket close while streaming","l":"reconciliation poll every 2,000 ms","s":"—","d":"On disconnect it re-reads the session from REST in a loop until isStreaming clears — deltas missed while offline can never be replayed, so the transcript is re-fetched instead of patched"},{"n":"memory_recall","t":"MemoryRecallEventPayload{injected,tokenCount,memories[],diagnostics?}","l":"one per prompt","s":"—","d":"Held as pendingMemoryRecall and attached to the NEXT assistant message, so the recall is shown against the answer it influenced rather than floating on its own"}],"out":[{"n":"sendMessage","t":"(text, sessionId?, {displayText?,copySummaryOnComplete?,awaitAcceptance?,acceptanceTimeoutMs?,images?,onRejected?}) → Promise<boolean>|boolean","l":"preflight timeout default 30,000 ms","s":"—","d":"Returns a boolean when fire-and-forget and a Promise when awaiting acceptance — the two call styles exist because a queued task needs to know it was accepted, while a keystroke-driven send does not"},{"n":"session-streaming events","t":"window CustomEvent per session","l":"—","s":"—","d":"Broadcast as DOM events rather than props because the sidebar, the shell and the panel all need it and none of them owns the others"}]},{"id":"TRANSPORT","n":"WebSocket singleton","t":"useWebSocket.ts · 139 lines · 1 exports","k":"risk","col":1,"row":0,"d":"RISK by design: one module-level socket for the whole tab, and an onUnmounted hook that deliberately does NOTHING. Closing the socket when one component unmounts would disconnect every other consumer sharing the same clientId — the comment in the file says exactly that, and it is the kind of thing a well-meaning cleanup refactor breaks.","in":[{"n":"connect","t":"ws(s)://<host>/ws/chat?clientId=<tab id>","l":"one socket per tab; concurrent connect() calls are guarded by isConnecting","s":"—","d":"Protocol is derived from window.location.protocol, so an https deployment gets wss without configuration"},{"n":"frame","t":"JSON, dispatched by data.type","l":"listeners: Map<string, Set<Function>>","s":"—","d":"A subscriber that never calls its returned unsubscribe leaks for the tab's lifetime — there is no weak-ref cleanup"}],"out":[{"n":"reconnect","t":"exponential backoff 1,000 ms × 2^n, capped at 30,000 ms","l":"maxAttempts = 10, then it gives up permanently","s":"—","d":"Giving up rather than retrying forever is deliberate: a server that has been gone for ten backoffs is not coming back on its own, and a page reload is the honest recovery"},{"n":"send","t":"JSON frame, or false if not OPEN","l":"—","s":"—","d":"Returns false rather than queueing — the caller decides, and useChat uses that to settle a pending preflight as rejected immediately"}]},{"id":"TERMSTATE","n":"Terminal state","t":"useTerminal.ts + useTerminalPanel.ts · 2 files / 674 lines / 14 exports","k":"comp","col":2,"row":0,"d":"Split deliberately: useTerminal owns one xterm instance and its socket, useTerminalPanel owns the multi-terminal panel (tabs, sizing, persistence of the panel height). One pty per socket means closing a tab kills exactly that shell.","in":[{"n":"open","t":"(cwd)","l":"one WebSocket and one pty per terminal tab","s":"—","d":"cwd defaults to the session's cwd, so a terminal opened from a worktree session lands inside the worktree, not the base repo"}],"out":[{"n":"panel geometry","t":"{height, activeTerminalId}","l":"—","s":"localStorage","d":"Restoring the panel height across reloads is why this is a composable and not component state"}]},{"id":"PREFS","n":"Preferences, theme & auth","t":"usePreferences.ts + useTheme.ts + useAuth.ts · 3 files / 530 lines / 12 exports","k":"comp","col":3,"row":0,"d":"Everything that must be decided before the first render. usePreferences is the largest (530 lines across this group) because it holds the streaming-message behaviour, sound notification policy, locale, editor options and sidebar defaults — and syncs them to the server so a second device agrees.","in":[{"n":"preferences","t":"GET /api/auth/preferences","l":"one row per account (there is one account)","s":"security settings via the auth routes","d":"streamingMessageBehavior lives here: whether Enter during a stream steers or follows up is the single preference with the most behavioural weight"},{"n":"auth check","t":"GET /api/auth/me","l":"on mount, before anything renders","s":"piui_session cookie","d":"A 401 here swaps the whole tree for LoginView rather than letting panels mount and each fail their own fetch"}],"out":[{"n":"theme","t":"data-theme on <html> + CSS custom properties","l":"light | dark | system","s":"localStorage","d":"Applied synchronously before the app mounts so there is no flash of the wrong theme"}]},{"id":"MEMSTATE","n":"Memory state","t":"useMemories.ts · 357 lines · 2 exports","k":"comp","col":4,"row":0,"d":"Bridges the Memory Center to both the REST surface and the push channel: list and mutate over /api/memories, but let memory_updated frames invalidate the list so the badge and the panel agree without polling.","in":[{"n":"memory_updated","t":"{profileId,projectId,extractionRunId,activeProjectCount,pendingGlobalCount,failed}","l":"one per completed run","s":"—","d":"Counts arrive with the event, so the badge updates without a refetch; the LIST is refetched only when the panel is open"},{"n":"memory_recall","t":"{injected, tokenCount, memories[], diagnostics}","l":"one per prompt","s":"—","d":"diagnostics carries the rejected-candidate ids and the budget ceiling — that is what makes \"why was nothing recalled?\" answerable in the UI"}],"out":[{"n":"mutation","t":"POST/PATCH/DELETE /api/memories/*","l":"expectedRevision on update and forget","s":"—","d":"A revision conflict surfaces to the user; retrying blindly would overwrite whatever the agent just wrote"}]},{"id":"DISCOVERY","n":"Search, skills & slash commands","t":"useFileSearch + useSearch + useSlashCommands + useAvailableSkills + useSkillPresets · 5 files / 719 lines / 14 exports","k":"comp","col":5,"row":0,"d":"The composables behind the composer's menus. All of them are read-mostly and debounced; useAvailableSkills and useSkillPresets are the ones that must invalidate on profile or cwd change, which is why they sit behind useLaunchResourceCache.","in":[{"n":"query","t":"string, debounced","l":"—","s":"—","d":"File search fetches a candidate list once per directory and scores locally, so keystrokes do not hit the server"},{"n":"skills","t":"GET /api/sessions/skills?cwd= · /agent-profiles/:id/skills","l":"cache key = (profileId, cwd)","s":"—","d":"A skill list is meaningless without both — the same profile in two projects genuinely has different skills available"}],"out":[{"n":"menu items","t":"{name, description, path?}[]","l":"—","s":"—","d":"Slash commands come from GET /api/slash-commands, which reads the agent's own command definitions — the menu is generated, never hard-coded"}]},{"id":"PROJECTSTATE","n":"Tasks, hosting, worktrees & gateways","t":"useProjectTasks + useGitHosting + useWorktreeBranches + useGatewaySettings + useReviewSources + useLaunchResourceCache · 6 files / 398 lines / 14 exports","k":"comp","col":6,"row":0,"d":"Thin REST wrappers with one piece of real logic between them: useLaunchResourceCache, which memoises the expensive launch lookups (profiles, models, skills, branches) keyed by (profileId, cwd) and is explicitly invalidated when either changes.","in":[{"n":"cache key","t":"launchCacheKey(profileId, cwd)","l":"one entry per pair, invalidated explicitly","s":"in-memory","d":"Without this, opening the new-session dialog re-fetches the model list and skill list on every keystroke in the path field"},{"n":"branches","t":"GET /api/sessions/worktree-branches?projectPath=","l":"local branches only","s":"—","d":"Remote branches are deliberately not offered: creating a worktree from a remote ref would need a fetch first, and the dialog cannot block on network"}],"out":[{"n":"invalidate","t":"invalidateLaunchResourceCache(key?)","l":"—","s":"—","d":"Called after a profile edit or a project change; forgetting it is exactly how a stale model list survives a settings change"}]}],"links":[{"s":["TRANSPORT",1],"t":["CHATSTATE",0],"l":"frames"},{"s":["CHATSTATE",0],"t":["TRANSPORT",1],"l":"send()"},{"s":["CHATSTATE",0],"t":["MEMSTATE",1],"l":"memory_recall"},{"s":["PREFS",0],"t":["CHATSTATE",0],"l":"steer vs follow-up"},{"s":["PROJECTSTATE",0],"t":["DISCOVERY",1],"l":"cached skills"}]});
dia({"id":"L4-PROMPT","lv":4,"parent":"L3-WS","title":"Code · one prompt, keystroke to rendered answer","sub":"The order is forced by three facts: memory must be injected before the model call, the client must be told the prompt was ACCEPTED before it commits the bubble, and a disconnect can happen at any step without losing the run","colw":246,"blocks":[{"id":"S1","n":"1 · Composer sends","t":"useChat.ts · sendMessage()","k":"code","col":0,"row":0,"d":"Chooses between prompt / steer / followUp purely from state.isStreaming and the operator's streamingMessageBehavior preference. The user bubble is pushed optimistically and isStreaming is set BEFORE the frame goes out, so the UI never looks idle while a send is in flight.","out":[{"n":"frame","t":"WSMessage{type:\"prompt\"|\"steer\"|\"followUp\", payload:{text, sessionId?, requestId?, images?}}","l":"≤4 images, base64","s":"—","d":"requestId is present only when the caller wants acceptance; without it there is no preflight round trip and the bubble is committed immediately"}]},{"id":"S2","n":"2 · Socket authenticates","t":"ws/chat.ts · app.get('/ws/chat')","k":"code","col":1,"row":0,"d":"Runs at UPGRADE, not per frame: Origin check, then cookie validation, then clientId presence. Fastify's global onRequest hook does not cover the WebSocket handshake, so skipping this here would leave the socket entirely unauthenticated.","out":[{"n":"accepted socket","t":"clientId bound in a closure for the socket's lifetime","l":"one socket per tab","s":"audit_events on either failure","d":"clientId is captured once as safeClientId — every later handler uses the closure, so a client cannot switch identity mid-socket by sending a different id"}]},{"id":"S3","n":"3 · Resolve the target session","t":"ws/chat.ts · ensureTargetSession()","k":"code","col":2,"row":0,"d":"Three cases in order: no sessionId → the client's current session; a matching live session → reuse it; otherwise list the sessions on disk and RESUME the named one. The resume path is what makes a prompt work after a server restart, with no client-side ceremony.","out":[{"n":"AgentSession","t":"the live SDK object","l":"one per sessionId process-wide","s":"~/.pi/<profile>/projects/<slug>/<id>.jsonl","d":"resumeSession() disposes its own freshly-built session if one already exists for that sessionId — two AgentSessions over one JSONL file would interleave writes"}]},{"id":"S4","n":"4 · Validate images","t":"services/image-input.ts · validateImages()","k":"code","col":3,"row":0,"d":"Checked against the SESSION'S MODEL, not just against static limits: a model whose input capabilities exclude images fails here, before any tokens are spent. Failure sends prompt_preflight{accepted:false} with a code, which is what lets the composer un-commit the bubble with an explanation.","out":[{"n":"validated images","t":"{ok:true, images:ImageContent[], names:string[]} | {ok:false, code, message}","l":"MAX_IMAGE_COUNT=4 · MAX_IMAGE_BYTES=10 MiB · png|jpeg|webp|gif","s":"—","d":"MIME is sniffed from the bytes, not trusted from the field — a mislabelled payload is rejected rather than handed to the provider"}]},{"id":"S5","n":"5 · Persist uploads into the project","t":"services/uploaded-image-store.ts · saveUploadedImages()","k":"code","col":4,"row":0,"d":"Writes accepted images as real files under the session cwd and APPENDS their paths to the prompt text as an \"[Uploaded image files]\" note. Passing bytes alone would let the model see an image once; giving it paths lets it re-open them with its own read tool twenty turns later.","out":[{"n":"paths","t":"string[] absolute","l":"one directory per project","s":"<cwd>/tmp/upload_images/","d":"Nothing ever deletes these — the transcript can reference them indefinitely, so garbage-collecting them would break old turns"}]},{"id":"S6","n":"6 · Enter the profile proxy scope","t":"session-manager.ts · runForegroundWithClientProfileProxy()","k":"code","col":5,"row":0,"d":"Wraps the entire run in runWithAgentDirAndProxyEnv AND in the memory coordinator's withForeground — the same call both sets the process-wide proxy for this profile and preempts any background extraction running under it. This is the choke point where foreground beats background.","out":[{"n":"scoped execution","t":"process.env proxy vars + PI_CODING_AGENT_DIR + undici global dispatcher","l":"strictly one distinct env context process-wide","s":"—","d":"A concurrent prompt under a DIFFERENT profile waits here — visible as latency, never as a wrong proxy, which is the trade this design chose"}]},{"id":"S7","n":"7 · Memory recall injects","t":"memory/extension.ts · pi.on('before_agent_start')","k":"code","col":0,"row":1,"d":"The last thing to touch the system prompt. It resolves the project (a worktree resolves to its BASE repo), scores candidates, and appends a bullet block — or, far more often, appends nothing at all because nothing scored above threshold. Any failure here is caught and logged; the turn proceeds unaugmented.","out":[{"n":"systemPrompt","t":"`${systemPrompt}\\n\\n${recall.prompt}`","l":"budget 0 | 400 | 800 | 1,500 | 2,500 tokens","s":"memory_recall_events row per prompt","d":"The recall event is emitted whether or not anything was injected — an empty recall with its diagnostics is exactly what the operator needs to debug \"why did it forget?\""}]},{"id":"S8","n":"8 · Subscribe and watch for loops","t":"ws/chat.ts · session.subscribe()","k":"code","col":1,"row":1,"d":"Every SDK event is forwarded, but tool_execution_start events also feed a small history. Three consecutive calls with an identical tool name AND identical serialised args trip loop detection, which aborts the run server-side — the operator cannot see the loop until it has eaten the context window.","out":[{"n":"event frame","t":"{type:\"event\", sessionId, event}","l":"history trimmed to 3 × MAX_REPEATED_TOOL_CALLS","s":"—","d":"On detection it sends loop_detected, then aborts best-effort and force-disposes if the abort does not settle — and suppresses the trailing idle status so the UI keeps the loop message visible"}]},{"id":"S9","n":"9 · Preflight acknowledges","t":"ws/chat.ts · sendPromptPreflight()","k":"code","col":2,"row":1,"d":"Delivered through the SDK's preflightResult callback, so it fires when the runtime has actually ACCEPTED the prompt — not when the socket received it. That distinction is what makes the client's pending bubble meaningful.","out":[{"n":"prompt_preflight","t":"{type:\"prompt_preflight\",sessionId,requestId,accepted,code?,message?,imagePaths?}","l":"one per requestId","s":"—","d":"imagePaths ride along so the composer can show where the uploads landed without a second call"}]},{"id":"S10","n":"10 · Client renders deltas","t":"useChat.ts · on('event')","k":"code","col":3,"row":1,"d":"text_delta and thinking_delta append to currentMessage; tool events upsert rows keyed by toolCallId so a result replaces its own call rather than appending a second row. An assistant message that produced neither text nor thinking is removed at message_end.","out":[{"n":"rendered rows","t":"Message{kind:\"text\"|\"thinking\"|\"tool_call\"|\"tool_result\"|\"status\", status, toolCallId?, usage?}","l":"one row per logical unit, not per delta","s":"in-memory per session","d":"The pending memory recall is attached to the FIRST assistant message of the turn, so the disclosure sits with the answer it shaped"}]},{"id":"S11","n":"11 · Settle and extract","t":"memory/extension.ts · pi.on('agent_settled')","k":"code","col":4,"row":1,"d":"The turn is over. If the leaf actually moved, an extraction run is enqueued for the branch between baselineLeafId and the new leaf, and the baseline advances. An aborted or empty turn leaves the leaf unchanged and enqueues nothing.","out":[{"n":"queued run","t":"EnqueueExtractionRunInput","l":"UNIQUE(source_session_id, ending_leaf_id, source_kind)","s":"memory_extraction_runs","d":"Enqueue failures are caught and logged only — a memory queue problem must never surface as a failed conversation turn"}]},{"id":"S12","n":"12 · Disconnect reconciliation","t":"useChat.ts · reconcileStreamingSession()","k":"code","col":5,"row":1,"d":"The recovery path. If the socket drops while streaming, the client cannot replay missed deltas, so it re-reads the whole session over REST every 2 seconds until isStreaming clears. The server, meanwhile, keeps running: the socket close handler aborts only if the tab is truly gone, and even then schedules disposal 5 minutes out.","out":[{"n":"refetched transcript","t":"GET /api/sessions/:id (force) → messages[]","l":"poll every 2,000 ms while streaming","s":"—","d":"A single in-flight guard (isReconcilingStreamingSession) stops overlapping polls — without it a slow fetch would stack reconciliations"}]}],"links":[{"s":["S1",0],"t":["S2",0],"l":"WSMessage"},{"s":["S2",0],"t":["S3",0],"l":"clientId"},{"s":["S3",0],"t":["S4",0],"l":"session + model"},{"s":["S4",0],"t":["S5",0],"l":"validated images"},{"s":["S5",0],"t":["S6",0],"l":"prompt + paths"},{"s":["S6",0],"t":["S7",0],"l":"inside proxy scope"},{"s":["S7",0],"t":["S8",0],"l":"augmented system prompt"},{"s":["S8",0],"t":["S9",0],"l":"accepted"},{"s":["S9",0],"t":["S10",0],"l":"preflight + events"},{"s":["S10",0],"t":["S11",0],"l":"turn complete"},{"s":["S8",0],"t":["S12",0],"l":"socket lost mid-stream"}]});
dia({"id":"L4-MEMEXTRACT","lv":4,"parent":"L3-MEMORY","title":"Code · one extraction run, settled turn to durable memory","sub":"Every step exists to make an unattended LLM call safe to run: it must be cheap to skip, abortable, bounded, schema-checked, secret-free and idempotent","colw":248,"blocks":[{"id":"E1","n":"1 · Enqueue","t":"memory/coordinator.ts · enqueue()","k":"code","col":0,"row":0,"d":"The run is written to SQLite before anything else happens, so the queue survives a crash. The UNIQUE(source_session_id, ending_leaf_id, source_kind) constraint is the whole dedup story — re-enqueueing the same leaf range is a no-op, not a second run.","out":[{"n":"run row","t":"MemoryExtractionRun{id,profileId,projectId,sourceSessionId,sourceSessionPath,sourceKind,startingLeafId?,endingLeafId,status:\"queued\",attempts:0}","l":"one row per distinct leaf range","s":"memory_extraction_runs","d":"Only a row that came back as status \"queued\" kicks the drain — an insert that hit the unique constraint returns the existing run and starts nothing"}]},{"id":"E2","n":"2 · Kick the per-profile drain","t":"memory/coordinator.ts · kick() / drain()","k":"code","col":1,"row":0,"d":"One drain loop per agent profile, guarded by three conditions: not stopped, no foreground work in flight, and no drain already running. The loop re-checks foregroundCount every iteration, so a prompt arriving mid-queue stops the queue after the current run rather than at the end of it.","out":[{"n":"claimed run","t":"claimNextExtractionRun(profileId) → status \"running\"","l":"one at a time per profile","s":"memory_extraction_runs","d":"Claiming is a status transition in SQLite, not an in-memory flag — which is what lets recoverInterruptedRuns() find the ones a crash left \"running\""}]},{"id":"E3","n":"3 · Read the branch","t":"memory/extraction-format.ts · buildExtractionSource()","k":"code","col":2,"row":0,"d":"Loads only the session entries between startingLeafId and endingLeafId and turns them into numbered evidence records (e1, e2…). Tool calls are kept only when they mutate (edit, write, apply_patch, create_file, delete_file) — a hundred reads say nothing durable.","out":[{"n":"ExtractionSource","t":"{evidence:[{id:\"e1\",role:\"user\"|\"assistant\"|\"tool\",text}], …}","l":"MAX_EXTRACTION_EVIDENCE_RECORDS = 64","s":"—","d":"Over 64 records the oldest are dropped: a very long turn would otherwise blow the prompt budget on a job the operator never asked for"}]},{"id":"E4","n":"4 · The cheap gate","t":"memory/extraction-gate.ts · evaluateDurableSignal()","k":"code","col":3,"row":0,"d":"Six bilingual regexes decide whether to spend a model call at all. Durable language (\"remember\", \"always\", \"记住\", \"以后\"), corrections, decisions or a confirmed outcome in an ASSISTANT message all extract. Empty, tool-only, pure acknowledgement and transient-task turns skip. Anything else is \"ambiguous\" — and ambiguous EXTRACTS, because the gate fails open.","out":[{"n":"gate result","t":"{decision:\"extract\"|\"skip\", reasonCode ∈ empty|acknowledgement|transient-task|tool-only|durable-language|correction|confirmed-decision|confirmed-outcome|explicit-import|ambiguous|gate-error}","l":"one decision per run","s":"memory_extraction_runs.gate_decision / gate_reason_code","d":"The reason code is persisted, which is the only way to answer \"why did it never learn that?\" after the fact — without it the skip is invisible"}]},{"id":"E5","n":"5 · Model call under the profile proxy","t":"memory/extractor.ts · execute()","k":"code","col":4,"row":0,"d":"Runs inside runWithAgentDirAndProxyEnv for the owning profile, with a 45-second timeout composed onto the coordinator's AbortSignal. Structured output is native JSON-schema only for anthropic / google / google-vertex / openai; every other provider gets prompt-JSON, because an unverified provider that ignores the schema returns confident garbage.","out":[{"n":"raw output","t":"{candidates:[{operation,scope,category,content,tags,evidenceIds,existingMemoryId}]}","l":"maxTokens 4,096 · EXTRACTION_TIMEOUT_MS 45,000 · ≤2 attempts","s":"—","d":"Transport and schema failures raise RetryableExtractionError and requeue; anything else fails the run outright — retrying a semantic failure would just burn the same tokens again"}]},{"id":"E6","n":"6 · Parse, bound and discard","t":"memory/extraction-format.ts · parseExtractionOutput()","k":"code","col":5,"row":0,"d":"Every field is bounds-checked and anything outside is DROPPED, never coerced. A truncated memory is a false memory, so the pipeline would rather learn eight facts than nine with one mangled.","out":[{"n":"candidates","t":"ValidatedExtractionCandidate[]","l":"≤8 candidates · content ≤220 chars · ≤4 tags of ≤24 chars · 1–4 evidence ids matching ^e[1-9][0-9]*$","s":"—","d":"discardedCount is carried forward and stored on the run, so a model that habitually overruns the schema is visible in the run history instead of silently lossy"}]},{"id":"E7","n":"7 · Secret scan and normalise","t":"memory/validation.ts · assertMemoryContent()","k":"code","col":0,"row":1,"d":"The last gate before content becomes durable. Four patterns — PEM private keys, sk-/rk- style API keys, gh[pousr]_ tokens, and password/api_key/token assignments — THROW rather than store. A credential quoted into a memory would be re-injected into every future system prompt.","out":[{"n":"normalised content","t":"whitespace-collapsed, trimmed, ≤2,000 chars; tags lowercased, deduped, ≤10 × ≤32 chars","l":"—","s":"—","d":"The dedup hash is sha256 of the LOWERCASED normalised text, so \"Use pnpm\" and \"use  pnpm\" are one memory"}]},{"id":"E8","n":"8 · Apply against existing memories","t":"memory/store.ts · applyExtractionCandidates()","k":"code","col":1,"row":1,"d":"Three operations: new inserts, duplicate touches the existing row's usage counters, replace supersedes a named memory and bumps its revision. Global-scope results land as status \"pending\" — an unattended process may not silently write a rule that applies to every project.","out":[{"n":"applied","t":"{createdCount,duplicateCount,replacedCount,discardedCount,activeProjectCount,pendingGlobalCount}","l":"UNIQUE(profile_id, IFNULL(project_id,''), scope, content_hash) WHERE status IN (active,pending)","s":"memories + memory_fts via triggers","d":"The unique index is PARTIAL: archiving a memory frees its hash, so a fact rejected months ago can be learned again if it comes back"}]},{"id":"E9","n":"9 · Complete and broadcast","t":"memory/coordinator.ts · completeRun() + emitRun()","k":"code","col":2,"row":1,"d":"The run is closed with its counters and an event goes onto the EventEmitter. Chat sockets forward it only to clients whose ACTIVE agent profile matches — memories are per profile, and a second profile's tab must not see another's counts.","out":[{"n":"memory_updated","t":"{profileId,projectId,extractionRunId,activeProjectCount,pendingGlobalCount,failed}","l":"one per finished run","s":"—","d":"The counts ride along with the event so the Memory badge updates without a refetch; only an OPEN Memory Center refetches the list"}]},{"id":"E10","n":"10 · Foreground preemption","t":"memory/coordinator.ts · withForeground()","k":"code","col":3,"row":1,"d":"The interrupt. Incrementing foregroundCount aborts the in-flight extraction and awaits the drain before the operator's work begins; the finally block decrements and kicks the queue again. A preemption requeue is flagged distinctly so it does not consume the 2-attempt retry budget.","out":[{"n":"requeued run","t":"requeueRun(id, \"Foreground request\", preempted:true) → status \"queued\"","l":"—","s":"memory_extraction_runs","d":"On shutdown the same path runs with the reason \"Server shutdown\" — the run comes back queued, so a restart resumes rather than loses it"}]},{"id":"E11","n":"11 · Recovery after a crash","t":"memory/store.ts · recoverInterruptedRuns()","k":"code","col":4,"row":1,"d":"Called once from start(). Anything left in \"running\" from a previous process is returned to \"queued\", because the process that claimed it no longer exists. Without this, a crash mid-extraction would strand the run forever and silently stop learning for that profile.","out":[{"n":"resumed queue","t":"listQueuedProfiles() → string[]","l":"every profile with queued work is kicked at boot","s":"memory_extraction_runs","d":"Recovery runs BEFORE the first kick, so a recovered run is picked up in the same pass rather than waiting for the next settled turn"}]}],"links":[{"s":["E1",0],"t":["E2",0],"l":"queued"},{"s":["E2",0],"t":["E3",0],"l":"claimed run"},{"s":["E3",0],"t":["E4",0],"l":"evidence records"},{"s":["E4",0],"t":["E5",0],"l":"decision = extract"},{"s":["E5",0],"t":["E6",0],"l":"raw JSON"},{"s":["E6",0],"t":["E7",0],"l":"bounded candidates"},{"s":["E7",0],"t":["E8",0],"l":"safe content"},{"s":["E8",0],"t":["E9",0],"l":"counters"},{"s":["E10",0],"t":["E2",0],"l":"requeue, then kick"},{"s":["E11",0],"t":["E2",0],"l":"recovered at boot"}]});
dia({"id":"L4-TASKSTART","lv":4,"parent":"L3-SERVICES","title":"Code · a queued task becomes a running agent session","sub":"A two-phase transaction with an asymmetric compensation: everything before session creation is reversible, and nothing after it is","colw":250,"blocks":[{"id":"T1","n":"1 · Claim the task","t":"project-task-store.ts · claimStart()","k":"code","col":0,"row":0,"d":"A single UPDATE moves waiting → starting. Two browser tabs pressing Start at the same moment cannot both win, because the second update matches no row in state 'waiting'.","out":[{"n":"claimed task","t":"ProjectTaskRecord{id,projectPath,title,prompt,notes,status:\"starting\",agentProfileId,modelProvider,modelId,skillMode,skills[],presetId?,worktree,sessionId?}","l":"one claim per task","s":"project_tasks","d":"If the process dies here the row stays \"starting\" forever — which is exactly why restoreAllStarting() runs at boot"}]},{"id":"T2","n":"2 · Resolve the skill preset","t":"project-task-starter.ts · resolveSkillPolicy()","k":"code","col":1,"row":0,"d":"A preset deleted between queueing and starting degrades to mode \"enabled\" with an empty skill list instead of failing the launch. The task still runs; it just runs without skills, which is recoverable, whereas a hard failure weeks later is merely annoying.","out":[{"n":"resolved policy","t":"{skillMode:\"all\"|\"enabled\"|\"disabled\", skills:string[], presetId:string|null}","l":"—","s":"—","d":"The resolution is applied to a COPY of the task record — the stored row keeps its presetId, so re-creating the preset restores the intent"}]},{"id":"T3","n":"3 · Validate against today's reality","t":"project-task-starter.ts · validateProfileModelAndSkills()","k":"code","col":2,"row":0,"d":"Three lookups before anything is built: the profile still exists, the model is still available for that profile, and every named skill is present FOR THAT PROJECT PATH. Skills are profile- and directory-scoped, so a task queued in one repo may name skills that do not exist in another.","out":[{"n":"validation","t":"throws ProjectTaskValidationError with the specific missing item","l":"—","s":"—","d":"Naming the exact profile, model or skill matters: \"task failed\" weeks after queueing is unactionable, \"skill X is unavailable\" is a one-click fix"}]},{"id":"T4","n":"4 · Resolve or create the worktree","t":"worktree-manager.ts · resolveSessionCwd()","k":"code","col":3,"row":0,"d":"Branch names are validated before touching the command line, an existing worktree for that branch is reused rather than re-added (git refuses a second one), and a chosen gitignored root file is copied in — the .env case.","out":[{"n":"resolved cwd","t":"ResolvedWorktreeSession{cwd, metadata?{baseRepoPath,worktreePath,branchName,branchMode,baseBranch?,worktreeManaged:true,worktreeStatus:\"active\"}}","l":"one worktree per branch","s":"the filesystem + session_worktrees","d":"mode \"none\" returns the project path unchanged, so the non-worktree case costs nothing"}]},{"id":"T5","n":"5 · Create the agent session","t":"session-manager.ts · createSession()","k":"code","col":4,"row":0,"d":"The point of no return. Skills, tools and the resource loader are frozen into the AgentSession here; the skill policy is persisted; the session-list cache is invalidated. From this line on, failure must NOT restore the task to waiting, or a retry would create a second session for one task.","out":[{"n":"CreateSessionResult","t":"{session:AgentSession, skillPolicy:AppliedSkillPolicy{mode,appliedSkills,ignoredSkills,presetId}}","l":"one AgentSession","s":"session_skill_policies row","d":"ignoredSkills is returned rather than dropped: a task that named a skill the policy could not apply reports it instead of silently running differently"}]},{"id":"T6","n":"6 · Record worktree metadata","t":"worktree-metadata-store.ts · save()","k":"code","col":5,"row":0,"d":"Binds sessionId to worktree. This row is what later lets the finish-worktree flow find the branch to merge and the directory to remove — and what lets memory resolve the session back to the BASE repo so branches share one memory project.","out":[{"n":"SessionWorktreeInfo","t":"the stored row with createdAt/updatedAt","l":"one per session","s":"session_worktrees (indexed on base_repo_path)","d":"The base_repo_path index exists for the memory lookup, not for the worktree UI"}]},{"id":"T7","n":"7 · Mark started, hand the prompt back","t":"project-task-store.ts · markStarted()","k":"code","col":0,"row":1,"d":"The task is bound to its sessionId (a UNIQUE column, so one session can back only one task) and the PROMPT IS RETURNED rather than sent. The browser submits it over the chat socket, so the task's first turn gets the whole streaming, preflight, memory-recall and steer machinery for free.","out":[{"n":"ProjectTaskStartResult","t":"{task, sessionId, prompt, model, thinkingLevel, worktree?}","l":"—","s":"project_tasks.session_id UNIQUE","d":"Returning the prompt instead of sending it is the design decision that keeps the task queue from needing its own transcript renderer"}]},{"id":"T8","n":"8 · Compensate on failure","t":"project-task-starter.ts · catch { restoreWaiting }","k":"code","col":1,"row":1,"d":"Guarded by a sessionCreated flag: if the failure happened BEFORE createSession returned, the task goes back to waiting and can be retried; if it happened after, the task stays \"starting\" and the operator resolves it by hand. Blind rollback here would be a session leak.","out":[{"n":"restored task","t":"status \"waiting\"","l":"only when sessionCreated === false","s":"project_tasks","d":"This is the asymmetry that makes the whole flow safe under retry — everything up to step 5 is idempotent, nothing after it is"}]},{"id":"T9","n":"9 · Self-heal at boot","t":"index.ts · projectTaskStore.restoreAllStarting()","k":"code","col":2,"row":1,"d":"Runs once during buildApp(). Any task left in \"starting\" by a crash goes back to waiting, because the process that claimed it is gone and its AgentSession died with it.","out":[{"n":"reset rows","t":"UPDATE project_tasks SET status='waiting' WHERE status='starting'","l":"one statement at boot","s":"project_tasks","d":"It cannot distinguish \"crashed before the session existed\" from \"crashed after\" — resetting is the safe direction, since an orphaned session is inert while a stuck task is permanent"}]}],"links":[{"s":["T1",0],"t":["T2",0],"l":"claimed"},{"s":["T2",0],"t":["T3",0],"l":"resolved policy"},{"s":["T3",0],"t":["T4",0],"l":"validated"},{"s":["T4",0],"t":["T5",0],"l":"cwd"},{"s":["T5",0],"t":["T6",0],"l":"sessionId"},{"s":["T6",0],"t":["T7",0],"l":"worktree bound"},{"s":["T3",0],"t":["T8",0],"l":"validation failed"},{"s":["T9",0],"t":["T1",0],"l":"stuck rows → waiting"}]});

  comp:  { f:'#13301f', s:'#4ade80', t:'#d9ffe6', tag:'Component'},
  code:  { f:'#2a2340', s:'#a78bfa', t:'#ece5ff', tag:'Code'     },
