dia({"id":"L1","lv":1,"title":"System context · Pi WebUI (@xianzhon/pi-webui 1.0.3)","sub":"One Node process owns every privileged resource — the Pi agent runtime, the pty, the git worktree, the SQLite file — and hands the browser only an event stream · 159 source files / 54,359 lines / 2,111 exported symbols","colw":250,"blocks":[{"id":"USER","n":"Operator (browser)","t":"Person · desktop or phone browser","k":"person","col":0,"row":0,"d":"The only role in the system. There is exactly one account: PI_WEBUI_AUTH_USERNAME plus one of PI_WEBUI_AUTH_PASSWORD / _PASSWORD_HASH — no user table, no roles, no sign-up. Everything the operator does runs with the full privileges of the Node process, which is why HOST defaults to 127.0.0.1 and every filesystem entry point re-checks the allowed roots.","out":[{"n":"prompt / steer / follow-up / abort","t":"WSMessage{type:\"prompt\"|\"steer\"|\"followUp\"|\"abort\", payload:{text?,sessionId?,requestId?,images?}}","l":"≤4 images · ≤10 MiB each (MAX_IMAGE_COUNT / MAX_IMAGE_BYTES)","s":"ws://<host>/ws/chat?clientId=<tab id>","d":"Every browser TAB owns its own clientId (sessionStorage + a localStorage owner heartbeat), so two tabs never share one agent session; duplicating a tab detects a live owner within OWNER_TTL_MS=5s and mints a fresh id instead"},{"n":"REST call","t":"fetch(/api/*) with the piui_session cookie","l":"130 endpoints across 12 route modules","s":"http(s)://<host>/api/*","d":"Every mutating method also passes an Origin==Host check before authentication, so a stolen cookie alone cannot drive a cross-site POST"}],"in":[{"n":"agent event stream","t":"{type:\"event\", sessionId, event:AgentSessionEvent}","l":"one WS frame per token delta","s":"—","d":"Deltas are never persisted client-side; on reconnect the client re-reads the session file over REST rather than trying to replay what it missed"}]},{"id":"IM","n":"IM user (WeChat / Feishu)","t":"Person · chat app, no browser","k":"person","col":0,"row":1,"d":"A second, deliberately narrower way in: the same agent sessions driven from a chat app, so a long run can be steered from a phone. Both gateways refuse to start a session until the operator has configured an allowed folder list in Settings → Gateway, because a chat message otherwise names an arbitrary cwd.","out":[{"n":"chat message","t":"WeixinMessagePayload{messageId,chatId,chatType,senderId,text,images,contextToken?} / FeishuMessagePayload{eventId,messageId,chatId,chatType,threadId?,text}","l":"WeChat: 35s long poll · Feishu: one webhook POST per event","s":"weixin_gateway_sessions / feishu_gateway_sessions","d":"Both are deduplicated by message id — WeChat for DEDUP_TTL_MS=5min, Feishu for 24h — because both platforms redeliver on any missed ack"}],"in":[{"n":"agent reply","t":"text bubble + typing indicator","l":"typing keep-alive every 5,000 ms","s":"—","d":"The typing ping must keep firing or the chat app drops the \"thinking\" state mid-run; it is cancelled explicitly on completion"}]},{"id":"CLIENT","n":"Vue 3 SPA","t":"client/ · 74 files / 35943 lines","k":"app","col":1,"row":0,"child":"L2-CLIENT","d":"A single-page app that owns no truth: every piece of session state it shows is either streamed over the chat WebSocket or re-read from REST. It is served as static files by the same Fastify process, so there is no second origin and the CSP can stay at script-src 'self'.","in":[{"n":"event / status / memory frame","t":"{type:\"event\"|\"status\"|\"prompt_preflight\"|\"compact_result\"|\"loop_detected\"|\"memory_updated\"|\"memory_recall\"}","l":"one socket per tab, shared by every component","s":"—","d":"useWebSocket is a module-level singleton: unmounting a component must NOT close it, or the other consumers on the same clientId go dark"}],"out":[{"n":"user intent","t":"WSMessage / fetch(/api/*)","l":"reconnect backoff 1s→30s, 10 attempts max","s":"—","d":"Beyond 10 attempts it stops retrying entirely rather than hammering a server that is clearly gone; the operator reloads the page"}]},{"id":"SERVER","n":"Fastify server","t":"server/ · 85 files / 18416 lines","k":"app","col":2,"row":0,"child":"L2-SERVER","d":"The protagonist: the only process that may spawn a pty, run git, open the SQLite file, or hold an AgentSession. It is single-process and single-user by design — which is exactly why process-wide state (proxy env vars, the undici global dispatcher) has to be serialised by hand.","in":[{"n":"authenticated request","t":"FastifyRequest + cookie piui_session","l":"5 failed logins per IP per 15 min (IpRateLimiter)","s":"sessions table (sha256 token hash)","d":"Only /api/health, /api/auth/*, the Feishu webhook and non-API GETs are public; everything else 401s before the handler runs"},{"n":"chat frame","t":"WSMessage over /ws/chat?clientId=…","l":"one AgentSession per (clientId, sessionId)","s":"~/.pi/<profile>/projects/<slug>/*.jsonl","d":"The WebSocket re-checks Origin and the cookie itself — the HTTP onRequest hook does not cover the upgrade"}],"out":[{"n":"agent events","t":"AgentSessionEvent via session.subscribe()","l":"3 identical consecutive tool calls trip loop detection","s":"—","d":"MAX_REPEATED_TOOL_CALLS=3: an agent stuck calling one tool with identical input is aborted server-side, because the operator cannot see the loop until it has burned the context window"},{"n":"git / pty / fs work","t":"execFile(\"git\",…) · pty.spawn(shell) · fs under the allowed roots","l":"git output capped at 256 KiB · status capped at 1,000 files","s":"the operator's real working tree","d":"Oversized git output is refused with a message rather than truncated, so nobody acts on a half diff"}]},{"id":"DB","n":"SQLite control plane","t":"Store · better-sqlite3 · WAL","k":"store","col":3,"row":0,"d":"Everything that must survive a restart but is NOT the conversation itself: auth sessions, TOTP secret, audit log, memories + FTS index, task queue, worktree metadata, skill policies, gateway credentials. Opened under umask 0o077 and chmod 0600 afterwards, before any secret can be written.","in":[{"n":"write","t":"23 tables + memory_fts (fts5) + 3 sync triggers","l":"journal_mode=WAL · busy_timeout=5000 · foreign_keys=ON","s":"~/.config/pi-webui/pi-webui.sqlite (PI_WEBUI_DB_PATH overrides)","d":"Schema migration is forward-only via ensureColumn(); there is no down path, so a downgrade after an upgrade leaves unread columns rather than breaking"}],"out":[{"n":"read back","t":"prepared statements, synchronous","l":"—","s":"same file","d":"better-sqlite3 is synchronous: every query blocks the event loop, which is acceptable only because this is a single-operator server"}]},{"id":"SESSIONS","n":"Pi session files","t":"Store · JSONL, one file per session","k":"store","col":3,"row":1,"d":"The conversation itself lives outside SQLite, in the Pi agent's own on-disk format, so the same sessions are visible to the Pi CLI. That is the reason the sidebar has to stream and parse JSONL to count user messages at all.","in":[{"n":"append entry","t":"SessionEntry JSONL lines (message / tool / tree nodes)","l":"written by the Pi SDK, not by this codebase","s":"~/.pi/<profileId>/projects/<path slug>/<sessionId>.jsonl","d":"A session can vanish between the directory listing and the read — every reader swallows ENOENT rather than failing the whole list"}],"out":[{"n":"session list + user message count","t":"SessionInfo{id,name,path,created,modified,messageCount,cwd,firstMessage}","l":"list cache TTL 2,000 ms · 10 files parsed concurrently","s":"same directory","d":"The upstream list API counts user AND assistant entries; the sidebar wants user turns only, so each file is streamed and counted, memoised by mtimeMs"}]},{"id":"PI","n":"Pi coding agent SDK","t":"External · @earendil-works/pi-coding-agent 0.80.6","k":"ext","col":4,"row":0,"d":"The agent runtime itself: tools, streaming, compaction, the session tree. This project wraps it rather than reimplementing it — createAgentSession() with a fixed tool set, plus inline extensions for memory recall and auto-rename. Everything below this line (models, prompts, tool execution) is the SDK's.","in":[{"n":"session construction","t":"createAgentSession({sessionManager, agentDir, resourceLoader, tools})","l":"tools = read·bash·edit·write·grep·find·ls (+ memory when enabled)","s":"agentDir = ~/.pi/<profileId>","d":"The tool list and the skill policy are frozen at construction — changing skills means disposing the AgentSession and building a new one"},{"n":"prompt","t":"session.prompt(text, {images?, streamingBehavior?, preflightResult?})","l":"abort waits ABORT_GRACE_MS=5,000 ms","s":"—","d":"If abort does not settle in 5 s the runtime is considered stuck and force-disposed; leaving it alive leaks a streaming session that the client can never clear"}],"out":[{"n":"event stream","t":"AgentSessionEvent{type:\"message_start\"|\"message_update\"|\"tool_execution_*\"|\"agent_settled\"|…}","l":"unbounded until agent_settled","s":"—","d":"agent_settled is also the memory extraction trigger — the leaf id it lands on becomes the next extraction baseline"}]},{"id":"LLM","n":"Model providers","t":"External · 30 API-key providers + subscriptions","k":"ext","col":4,"row":1,"d":"Reached in two distinct ways: the SDK's own path for the conversation, and a direct complete() call for the background jobs (memory extraction, commit-message and PR generation, auto-rename). Both go out through whatever proxy the active agent profile configures.","in":[{"n":"background completion","t":"complete({model, prompt, maxTokens:4096, structuredOutput})","l":"EXTRACTION_TIMEOUT_MS=45,000 · ≤2 retries for transport/schema errors","s":"—","d":"Only anthropic/google/google-vertex/openai are trusted with native JSON-schema output; every other provider falls back to prompt-JSON, because a provider that silently ignores the schema produces unparseable candidates"},{"n":"credentials","t":"API key from ~/.pi/<profile>/ AuthStorage; proxy from agent_profile_settings.proxy_json","l":"one proxy context at a time, process-wide","s":"agent_profile_settings table","d":"Keys are never held in this codebase's memory beyond the call — they are read from the profile's AuthStorage each time"}],"out":[{"n":"completion","t":"{candidates:[…]} JSON validated against EXTRACTION_OUTPUT_SCHEMA","l":"≤8 candidates · ≤220 chars each · ≤4 tags · ≤4 evidence ids","s":"—","d":"Anything outside the schema is discarded and counted, never coerced — a malformed candidate must not become a durable memory"}]},{"id":"OS","n":"pty · git · working tree","t":"External process · node-pty, git CLI","k":"extc","col":5,"row":0,"d":"Real child processes with the server's full privileges. The only guard is resolveAllowedPath(), which realpath-resolves the nearest existing ancestor and requires it inside PI_WEBUI_ALLOWED_ROOTS (default: the home directory).","in":[{"n":"terminal input / resize","t":"{type:\"input\"|\"resize\", terminalId, data|cols,rows}","l":"one pty per WebSocket connection; 80×24 at spawn","s":"\\\\.\\pipe (win32) / a pseudo-terminal (posix)","d":"Terminals are keyed by connection, not by clientId: the socket close handler disposes exactly its own pty, so one closed tab cannot kill another tab's shell"},{"n":"git command","t":"execFile(\"git\", args, {cwd, maxBuffer})","l":"maxBuffer 256 KiB","s":"the operator's repository","d":"On Windows the path check is DISABLED by default (isPathCheckDisabled returns true when PI_WEBUI_DISABLE_PATH_CHECK is unset) — a deliberate platform weakening worth knowing about"}],"out":[{"n":"pty output / git stdout","t":"{type:\"output\"|\"exit\", terminalId, data|exitCode} · raw stdout","l":"streamed per chunk","s":"—","d":"A pty write to a dead terminal is silently dropped by the Map lookup rather than throwing"}]},{"id":"HOST","n":"GitHub / Gitea","t":"External · REST over HTTPS","k":"ext","col":5,"row":1,"d":"Optional. Present so a session can end in a real pull request without leaving the UI. Credentials live in security_settings, not dia({"id":"L2-SERVER","lv":2,"parent":"L1","title":"Container · Fastify server (server/ · 85 files / 18416 lines)","sub":"Layered by what each directory is allowed to touch: routes never spawn anything, services own the privileged resources, memory owns its own queue","colw":248,"blocks":[{"id":"ENTRY","n":"Bootstrap & wiring","t":"index.ts · 424 lines · 3 exports","k":"app","col":0,"row":0,"d":"The whole dependency graph is constructed here, by hand, in one function — buildApp(). There is no DI container, so the construction ORDER in this file is the architecture: the database opens first, the worktree store decorates it, the memory runtime is built on both, and only then can the session service be initialised, because createSession() needs the memory runtime to attach its inline extension.","in":[{"n":"environment","t":".env resolved in 3 layers, then process.env wins","l":"—","s":"repo/.env → cwd/.env → $XDG_CONFIG_HOME/pi-webui/.env","d":"Shell variables beat every file; on a first run with no auth configured at all, a random 6-byte password is generated and written to the user .env with mode 0600 and flag \"wx\" so a concurrent start cannot clobber it"},{"n":"every HTTP request","t":"FastifyRequest","l":"—","s":"—","d":"Two global hooks run before any handler: an Origin check on mutating methods, then cookie-session renewal — both record an audit row on rejection"}],"out":[{"n":"plugin registration","t":"app.register(routes, {prefix, …injected stores})","l":"12 route plugins + 2 WebSocket plugins","s":"—","d":"Stores are injected as route options rather than imported, which is why the route modules are testable without a real database — except sessionService, which is a module-level singleton and the one place that leaks"},{"n":"response headers","t":"CSP + nosniff + DENY + no-referrer + Permissions-Policy","l":"on every response via onSend","s":"—","d":"script-src 'self' with no CDN is only possible because the SPA is served by this same process; adding an external font or script would require weakening it"}]},{"id":"AUTHZ","n":"Authentication & audit","t":"auth/ + config/ · 9 files / 510 lines","k":"comp","col":1,"row":0,"child":"L3-AUTH","d":"A single-account gate. Kept as its own directory because every entry point — REST, both WebSockets, the gateway webhook — has to make the same three decisions (origin allowed? cookie valid? record the attempt?) and any one of them getting it wrong exposes a shell.","in":[{"n":"login attempt","t":"{username, password, code?}","l":"5 failures per IP per 15 min","s":"audit_events table","d":"A blocked IP is rejected before the scrypt call, so the rate limiter also protects against using login latency as a CPU amplifier"}],"out":[{"n":"session cookie","t":"piui_session = 32 random bytes (hex)","l":"TTL 8 h sliding, absolute cap 30 days","s":"sessions table stores only sha256(token)","d":"Renewal happens on request when past half the TTL, but never beyond absolute_expires_at — a permanently-open tab still has to log in again within 30 days"}]},{"id":"ROUTES","n":"REST surface","t":"routes/ · 12 files / 4327 lines","k":"comp","col":2,"row":0,"child":"L3-ROUTES","d":"130 endpoints under /api/*. Deliberately thin: a handler validates, calls one service, and shapes a response. The two largest files (sessions.ts, git.ts) are large because they are the surface of two large subsystems, not because they contain logic.","in":[{"n":"HTTP request","t":"query/body JSON; clientId carried explicitly, never inferred","l":"—","s":"—","d":"clientId is a REQUEST parameter, not a cookie field: one authenticated operator legitimately drives many independent agent sessions from many tabs"}],"out":[{"n":"service call","t":"a method on exactly one injected store or the sessionService singleton","l":"—","s":"—","d":"Handlers that touch the filesystem all funnel through resolveAllowedPath() first; that is the single choke point protecting the git, files and terminal surfaces"}]},{"id":"WS","n":"WebSocket handlers","t":"ws/ · 3 files / 529 lines","k":"comp","col":3,"row":0,"child":"L3-WS","d":"Two sockets with completely different lifetimes: /ws/chat is one long-lived socket per browser tab that outlives any single session, /ws/terminal is one socket per pty. Both re-authenticate on upgrade because Fastify's onRequest hook does not cover the WebSocket handshake.","in":[{"n":"upgrade + frames","t":"GET /ws/chat?clientId=… · GET /ws/terminal?clientId=&cwd=","l":"one chat socket per tab; one pty per terminal socket","s":"—","d":"A missing clientId closes the socket immediately — there is no default, because a shared default would merge two operators' tabs onto one agent session"}],"out":[{"n":"frames to the browser","t":"JSON via sendJson()","l":"—","s":"—","d":"sendJson checks readyState AND swallows the throw: a socket can close between the check and the send, and client delivery must never be able to abort a running agent"}]},{"id":"SERVICES","n":"Privileged services","t":"services/ · 32 files / 7120 lines","k":"comp","col":4,"row":0,"child":"L3-SERVICES","d":"Everything that owns a resource: the AgentSession map, the pty map, git worktrees, the task queue, the two IM gateways, the review-source adapters, and the process-wide proxy context. This is where the real concurrency hazards live.","in":[{"n":"service call from a route or ws handler","t":"typed method arguments","l":"—","s":"—","d":"Most services take their database handle in the constructor and are instantiated once in index.ts; sessionService and terminalManager are the exceptions — module singletons, because the pty and AgentSession maps must be process-global"}],"out":[{"n":"side effect","t":"child process · file write · SQLite row · outbound HTTPS","l":"—","s":"the real filesystem, the real repo, the real remote","d":"Any HTTPS call that must honour the profile proxy has to run inside runWithAgentDirAndProxyEnv(), which mutates process.env globally — see the risk block below"}]},{"id":"MEMORY","n":"Durable memory","t":"memory/ · 19 files / 4337 lines","k":"comp","col":5,"row":0,"child":"L3-MEMORY","d":"A self-contained subsystem with its own queue, its own model calls and its own prompt-format versioning. It is separate from services/ because it is the only part of the server that runs work the operator did not ask for — background LLM calls after every settled turn — and therefore needs to yield to the foreground.","in":[{"n":"agent_settled","t":"EnqueueExtractionRunInput{profileId,projectId,sourceSessionId,sourceSessionPath,startingLeafId?,endingLeafId,modelProvider?,modelId?}","l":"UNIQUE(source_session_id, ending_leaf_id, source_kind)","s":"memory_extraction_runs table","d":"The uniqueness constraint is the dedup: replaying the same leaf range can never enqueue twice, so a restart mid-run cannot double-extract"},{"n":"before_agent_start","t":"the user prompt text","l":"budget 0 / 400 / 800 / 1,500 / 2,500 tokens by match strength","s":"—","d":"Nothing is injected at all when nothing scores above MIN_RECALL_SCORE=0.75 — an empty recall is the intended common case, not a failure"}],"out":[{"n":"system-prompt injection","t":"`${systemPrompt}\\n\\n${recallPrompt}`","l":"≤ the budget above","s":"—","d":"Recall failure is swallowed and logged: a broken memory lookup must never block the operator's turn"},{"n":"memory_updated / memory_recall","t":"MemoryUpdatedEvent / MemoryRecallEvent on an EventEmitter","l":"one per completed run / one per prompt","s":"memories + memory_recall_events tables","d":"Broadcast to chat sockets only after matching the socket's active profile — memories are per agent profile, and a second profile's tab must not see them"}]},{"id":"DB","n":"SQLite schema & migrations","t":"db/database.ts · 374 lines · 2 exports","k":"store","col":6,"row":0,"d":"One function creates every table, index, FTS virtual table and trigger, then applies forward-only ensureColumn() migrations. It is a single file on purpose: the schema is the contract between eight otherwise unrelated stores, and splitting it would let two of them disagree about a column.","in":[{"n":"open","t":"openPiuiDatabase(dbPath)","l":"process.umask(0o077) around the open, chmod 0600 after","s":"~/.config/pi-webui/pi-webui.sqlite + -wal + -shm","d":"SQLite creates the journal sidecars with the process umask — restricting it only around the open is what stops the WAL file from being world-readable while it holds the TOTP secret"}],"out":[{"n":"PiuiDatabase","t":"better-sqlite3 Database (synchronous)","l":"WAL · busy_timeout 5,000 ms · foreign_keys ON","s":"same file","d":"session_builtin_events is rebuilt table-and-all when its CHECK constraint lacks 'branch_deleted' — SQLite cannot ALTER a CHECK, so the migration renames, recreates and copies"}]},{"id":"SHARED","n":"Shared types & path guards","t":"types.ts + utils/ + extensions/ · 5 files / 614 lines","k":"lib","col":7,"row":0,"d":"The wire contract (server/src/types.ts, 35 exported interfaces) plus the two guards everything depends on. Stateless on purpose — nothing here holds a handle, so any layer may import it without an ordering constraint.","in":[{"n":"candidate path","t":"string from a query, body, or chat message","l":"—","s":"—","d":"resolveAllowedPath walks up to the nearest EXISTING ancestor before realpath — otherwise creating a new file under an allowed root would fail its own check"}],"out":[{"n":"resolved path","t":"absolute path, or throws PathAccessError (403)","l":"roots from PI_WEBUI_ALLOWED_ROOTS, default os.homedir()","s":"—","d":"On win32 the check is off unless PI_WEBUI_DISABLE_PATH_CHECK is explicitly set to false-ish — symlink realpath semantics differ enough there that the author chose to disable rather than half-enforce"}]},{"id":"PROXYRISK","n":"Process-wide proxy context","t":"services/profile-proxy.ts · 181 lines · 10 exports","k":"risk","col":6,"row":1,"d":"RISK — genuinely global mutable state. Per-profile proxying is implemented by mutating process.env and replacing undici's global dispatcher, then restoring both. Calls with an IDENTICAL env key are allowed to overlap and share one context by refcount; a call with a DIFFERENT key must await the active one. Get this wrong and one profile's request silently goes out through another profile's proxy.","in":[{"n":"scoped work","t":"runWithAgentDirAndProxyEnv(agentDir, proxyEnv, fn)","l":"strictly one distinct env context at a time, process-wide","s":"process.env + undici global dispatcher","d":"The key is JSON of {agentDir, 8 proxy vars} — refcounting on that key is what keeps concurrent same-profile requests from serialising into a queue"}],"out":[{"n":"restored environment","t":"the previous dispatcher and env snapshot","l":"on the last release of the refcount","s":"—","d":"A throw inside fn still releases via finally; the danger is not leakage but latency — a slow foreground request under one profile blocks every other profile's outbound call"}]}],"links":[{"s":["ENTRY",0],"t":["AUTHZ",0],"l":"authConfig · SessionStore"},{"s":["ENTRY",0],"t":["ROUTES",0],"l":"register(prefix, stores)"},{"s":["ENTRY",0],"t":["WS",0],"l":"register(chat, terminal)"},{"s":["ROUTES",0],"t":["SERVICES",0],"l":"service call"},{"s":["WS",0],"t":["SERVICES",0],"l":"sessionService · terminalManager"},{"s":["SERVICES",0],"t":["MEMORY",0],"l":"inline extension"},{"s":["MEMORY",0],"t":["DB",0],"l":"memories · extraction runs"},{"s":["AUTHZ",0],"t":["DB",0],"l":"sessions · audit · totp"},{"s":["SERVICES",0],"t":["SHARED",0],"l":"resolveAllowedPath"},{"s":["SERVICES",0],"t":["PROXYRISK",0],"l":"runWithAgentDirAndProxyEnv"},{"s":["MEMORY",0],"t":["PROXYRISK",0],"l":"extraction under profile proxy"}]});
dia({"id":"L2-CLIENT","lv":2,"parent":"L1","title":"Container · Vue 3 SPA (client/ · 74 files / 35943 lines)","sub":"Composables hold all shared state as module-level singletons; components are large because the panels are large, and App.vue is the wiring harness they all talk through","colw":252,"blocks":[{"id":"BOOT","n":"Entry & build","t":"main.ts + router.ts + vite.config.ts · 6 files / 131 lines","k":"lib","col":0,"row":0,"d":"Two routes, both rendering App.vue: / and /sessions/:id. The router exists only so a session gets a shareable URL — there is no route-level code splitting, which is why the initial bundle carries Monaco and xterm for everyone.","in":[{"n":"page load","t":"GET / (SPA fallback from the server's notFoundHandler)","l":"—","s":"client/dist/index.html","d":"Any GET without a file extension and outside /api//ws falls through to index.html, so a deep link to /sessions/<id> survives a refresh"}],"out":[{"n":"mounted app","t":"createApp(App).use(router).use(i18n)","l":"—","s":"#app","d":"In dev, Vite proxies /api and /ws to PORT (default 3000) — the SPA never learns the backend origin, which is what keeps the Origin==Host check satisfiable in both modes"}]},{"id":"SHELL","n":"App.vue — application shell","t":"App.vue · 2808 lines · 202 exports","k":"risk","col":1,"row":0,"d":"RISK — 202 bindings in one file. It is the shell, the layout manager, the modal host and the cross-panel event bus all at once: it owns sidebar/editor/terminal/task-queue visibility, session selection and renaming, worktree finish, git-hosting settings, gateway settings, and the auth gate. Nothing here is gratuitous, but every new panel adds refs to this one file, so it grows monotonically. Splitting it means first giving the panels a shared store instead of props+emits.","in":[{"n":"auth state","t":"useAuth().isAuthenticated","l":"one check before anything else renders","s":"—","d":"LoginView replaces the entire tree while unauthenticated, so no panel ever mounts against a 401"},{"n":"route param","t":"/sessions/:id","l":"—","s":"—","d":"The route id is the source of truth for which session is displayed; useChat keeps per-session state keyed separately so switching sessions does not discard a stream in progress"}],"out":[{"n":"panel visibility & props","t":"showEditor / showTaskQueue / showSearch / showSettings / sidebarCollapsed refs","l":"—","s":"localStorage for sidebar collapse","d":"Panel state deliberately does NOT live in the router — a reload should restore the conversation, not the operator's transient layout"}]},{"id":"COMPONENTS","n":"Panels & dialogs","t":"components/ · 28 files / 25208 lines","k":"comp","col":2,"row":0,"child":"L3-COMPONENTS","d":"28 single-file components, 1423 script bindings. Six of them exceed 80 bindings on their own — they are the real weight of this codebase and each gets its own rectangle one level down.","in":[{"n":"props from the shell","t":"session id, cwd, streaming flag, skill policy, model summary","l":"—","s":"—","d":"Panels receive state and emit intent; none of them fetches session data directly except through a composable, which is what keeps two panels from disagreeing about the same session"}],"out":[{"n":"emit","t":"@send @abort @select-session @open-file @finish-worktree …","l":"—","s":"—","d":"Cross-panel signals that do not fit props travel as window CustomEvents (e.g. plan-report-updated) — a deliberate escape hatch, and the only global coupling between panels"}]},{"id":"COMPOSABLES","n":"Stateful composables","t":"composables/ · 19 files / 3852 lines","k":"comp","col":3,"row":0,"child":"L3-COMPOSABLES","d":"The client's actual state layer. Almost every one of these creates its refs at MODULE scope, not inside the function — so useChat() called from three components returns the same state. That is the design (there is no Pinia), and it is also the reason unmounting a component must never tear down a socket or a timer.","in":[{"n":"WebSocket frame","t":"{type, sessionId, event|message|status}","l":"one dispatch table, many subscribers","s":"—","d":"Frames are routed by data.type into a Map<string, Set<Function>>; a component that forgets to call the returned unsubscribe leaks a listener for the life of the tab"}],"out":[{"n":"reactive session state","t":"SessionChatState{messages, isStreaming, currentMessage, pendingMemoryRecall} keyed by sessionId","l":"one entry per session the tab has opened","s":"in-memory only","d":"Keeping state per SESSION rather than one global list is what lets a background session keep streaming while the operator reads another one"}]},{"id":"CLIENTLIB","n":"Browser services & utils","t":"services/ + utils/ · 10 files / 1201 lines","k":"lib","col":4,"row":0,"d":"Small, mostly pure, and the home of the two pieces of genuinely tricky browser logic: tab identity (tabClientId) and ANSI-to-HTML for terminal-ish output. Everything else here is localStorage bookkeeping and formatting.","in":[{"n":"tab identity request","t":"getTabClientId()","l":"owner heartbeat every 2,000 ms · owner TTL 5,000 ms","s":"sessionStorage: pi-webui-client-id · localStorage: pi-webui-client-owner:<id>","d":"A duplicated tab inherits sessionStorage, so the id would collide; the localStorage owner record with a heartbeat is how the second tab detects the live owner and mints a new id instead"},{"n":"recent file","t":"addRecentFile(path)","l":"MAX_RECENT_FILES = 20","s":"localStorage: pi-webui-recent-files","d":"Reads are wrapped in try/catch because private-mode browsers throw on access, not just on write"}],"out":[{"n":"clientId","t":"string, stable for the tab's lifetime","l":"—","s":"—","d":"Released on pagehide so a closed tab frees its id — otherwise every reopen would burn a fresh clientId and leave an orphaned server-side session waiting for its 5-minute cleanup"}]},{"id":"CTYPES","n":"Wire types","t":"types/ · 7 files / 342 lines","k":"lib","col":5,"row":0,"d":"The client's copy of the server contract — hand-mirrored, not generated. 44 exported types across 7 files; drift between these and server/src/types.ts is caught only by the tests that exercise both.","in":[{"n":"JSON from REST/WS","t":"unknown","l":"—","s":"—","d":"Types are structural assertions, not runtime validation — the client trusts its own server, which is defensible only because both ship in one package"}],"out":[{"n":"typed value","t":"SessionInfo · ProjectTaskRecord · MemoryRecord · ReviewSource · SessionLaunchOptions","l":"—","s":"—","d":"sessionLaunch.ts is the interesting one: it encodes the launch matrix (profile × model × skill policy × worktree) that both the new-session dialog and the task editor must agree on"}]},{"id":"I18N","n":"Localisation","t":"i18n/ · 3 files / 2401 lines","k":"lib","col":6,"row":0,"d":"English and Simplified Chinese, 1,190 lines each, kept structurally identical — zh-CN.test.ts asserts the key sets match, which is the only thing stopping a half-translated release.","in":[{"n":"locale switch","t":"setLocale(\"en\" | \"zh-CN\")","l":"2 locales","s":"—","d":"Also sets document.documentElement.lang, which is what makes the browser pick the right font stack for CJK"}],"out":[{"n":"translated string","t":"t(key, params)","l":"—","s":"—","d":"fallbackLocale is en: a missing zh-CN key renders English rather than the raw key, so a translation gap degrades quietly"}]}],"links":[{"s":["BOOT",0],"t":["SHELL",0],"l":"mount"},{"s":["SHELL",0],"t":["COMPONENTS",0],"l":"props"},{"s":["COMPONENTS",0],"t":["COMPOSABLES",0],"l":"useChat() · useMemories()"},{"s":["COMPOSABLES",0],"t":["CLIENTLIB",0],"l":"getTabClientId()"},{"s":["COMPOSABLES",0],"t":["CTYPES",0],"l":"typed payloads"},{"s":["SHELL",0],"t":["I18N",0],"l":"setLocale"}]});
dia({"id":"L3-AUTH","lv":3,"parent":"L2-SERVER","title":"Component · Authentication & audit (auth/ + config/ · 9 files / 510 lines)","sub":"Single account, cookie sessions, and the rule that every rejection leaves a row behind","colw":250,"blocks":[{"id":"CFG","n":"Auth configuration","t":"config/ · 2 files / 71 lines · 3 exports","k":"lib","col":0,"row":0,"d":"Fails fast and loudly: loadAuthConfig() throws at boot if the username or a password/hash is missing, rather than starting an unauthenticated server. The first-run path in index.ts exists precisely so that failure never reaches a fresh user — it generates credentials instead.","in":[{"n":"process.env","t":"PI_WEBUI_AUTH_USERNAME · _PASSWORD | _PASSWORD_HASH · _SESSION_TTL_HOURS · _SESSION_MAX_HOURS · _DB_PATH · _TRUST_PROXY · _COOKIE_SECURE","l":"—","s":"shell > repo .env > cwd .env > user .env","d":"SKIP_2FA_VERIFY exists as a config field: a development escape hatch that is worth knowing is reachable from the environment"}],"out":[{"n":"AuthConfig","t":"{username,password?,passwordHash?,sessionTtlHours=8,sessionMaxHours=720,dbPath,trustProxy,skip2faVerify,cookieSecure,cookieName:\"piui_session\"}","l":"—","s":"—","d":"cookieName is hard-coded, not configurable — two Pi WebUI instances on the same host and different ports will share the cookie jar and fight over it"}]},{"id":"PWD","n":"Password verification","t":"password.ts · 52 lines · 2 exports","k":"lib","col":1,"row":0,"d":"scrypt at OWASP's recommended work factor, with a fixed format string so the hash is self-describing. The plaintext-password path exists for convenience but still goes through timingSafeEqual — the comparison is constant-time in both modes.","in":[{"n":"candidate password","t":"string from the login body","l":"N=2^15, r=8, p=3, maxmem=64 MiB → ~100 ms and 32 MiB per attempt","s":"—","d":"That cost is why the IP rate limiter runs BEFORE this call: 5 concurrent guesses would otherwise be 160 MiB of memory pressure"}],"out":[{"n":"verdict","t":"boolean","l":"—","s":"—","d":"A hash that does not match the exact $scrypt$ln=15,r=8,p=3$ pattern returns false rather than attempting to parse it — an unparseable hash must never accidentally verify"}]},{"id":"SESS","n":"Cookie session store","t":"sessions.ts · 112 lines · 4 exports","k":"store","col":2,"row":0,"d":"Two expiries per session, and that is the whole design: a sliding one that renews on use, and an absolute one that never moves. Only the sha256 of the token is stored, so a stolen database file does not yield usable cookies.","in":[{"n":"createSession","t":"{username, ttlHours, maxLifetimeHours, ip, userAgent}","l":"token = 32 random bytes, id = 16","s":"sessions table","d":"expires_at is min(ttl, absolute) at creation, so a 30-day cap is enforced from the first request rather than at renewal time"},{"n":"validateToken","t":"token + optional {ttlHours}","l":"renewal only past 50% of the TTL (RENEWAL_THRESHOLD_FRACTION)","s":"—","d":"Renewing on every request would rewrite the row on every poll; the half-life threshold keeps writes rare while still making an active tab effectively permanent"}],"out":[{"n":"SessionRecord","t":"{id,username,created_at,expires_at,absolute_expires_at,last_seen_at,renewed?,ip,user_agent}","l":"—","s":"—","d":"An expired token is DELETED on the failed validation, not just rejected — so the table self-cleans under normal traffic"}]},{"id":"REQ","n":"Request context & cookie plumbing","t":"request.ts · 52 lines · 6 exports","k":"lib","col":3,"row":0,"d":"The one place that decides whose IP is being audited. X-Forwarded-For is honoured only when PI_WEBUI_TRUST_PROXY is set — behind no proxy, trusting it would let any client forge its own audit trail and dodge the rate limiter.","in":[{"n":"FastifyRequest","t":"headers.x-forwarded-for · headers.user-agent · cookies","l":"—","s":"—","d":"Only the FIRST entry of X-Forwarded-For is taken, and only under trustProxy — the rest of the chain is attacker-controlled"}],"out":[{"n":"set/clear cookie","t":"httpOnly · sameSite=lax · secure=cookieSecure · path=/","l":"expires = the session's next expiry","s":"browser cookie jar","d":"sameSite=lax rather than strict, because the SPA is entered by ordinary top-level navigation and strict would drop the cookie on the first load from a bookmark"}]},{"id":"ORIGIN","n":"Origin allow-list","t":"origin.ts · 50 lines · 3 exports","k":"lib","col":4,"row":0,"d":"The CSRF defence. A missing Origin header is ALLOWED (curl, native clients, some proxies); a present one must match the Host, with one exception: loopback-to-loopback, so Vite on :5173 can talk to Fastify on :3000 in development.","in":[{"n":"origin + host headers","t":"string | string[] | undefined","l":"checked on every mutating method and both WS upgrades","s":"—","d":"An unparseable Origin returns false — failing closed is right here, because the only clients sending a malformed Origin are not the SPA"}],"out":[{"n":"allow / deny","t":"boolean","l":"—","s":"audit_events on deny (http_origin_rejected / websocket_origin_rejected)","d":"isAllowedCorsOrigin is DIFFERENT and stricter: CORS is granted only to loopback origins, so a same-host non-loopback deployment gets no CORS at all — intentional, since the SPA is same-origin"}]},{"id":"TOTP","n":"TOTP second factor","t":"totp.ts · 57 lines · 1 exports","k":"comp","col":5,"row":0,"d":"Optional and off by default. The subtlety is in verify(): when TOTP is disabled it returns TRUE, so the login route can call it unconditionally without branching — but that also means a bug clearing totp.enabled silently downgrades the account to one factor.","in":[{"n":"code","t":"6-digit string","l":"otplib default window","s":"security_settings: totp.secret, totp.enabled","d":"The secret sits in the same SQLite file as the auth sessions; that file being chmod 0600 is the entire protection"},{"n":"setup","t":"createSetup()","l":"—","s":"—","d":"The secret is returned to the browser and only persisted once a valid code proves the operator actually enrolled it"}],"out":[{"n":"otpauth URL + QR","t":"{secret, otpauthUrl, qrCodeDataUrl}","l":"—","s":"—","d":"The QR is rendered server-side into a data: URL so no third-party QR service ever sees the secret"}]},{"id":"RL","n":"IP rate limiter","t":"rate-limit.ts · 36 lines · 1 exports","k":"risk","col":6,"row":0,"d":"RISK — in-memory only. maxFailures=5 per windowMs=15 min, held in a Map that is never swept except lazily on the next attempt from the same IP, and lost entirely on restart. An attacker who can trigger a restart resets every counter; a long-running server accumulates one array per attacking IP.","in":[{"n":"recordFailure(ip)","t":"string","l":"5 failures / 15 min window","s":"process memory (Map<string, number[]>)","d":"Entries are pruned only when that same IP is seen again — an IP that attacks once and stops leaves its timestamps in the Map for the process's lifetime"}],"out":[{"n":"isBlocked(ip)","t":"boolean","l":"—","s":"—","d":"recordSuccess deletes the entry outright, so one correct password clears the block — which is the intended behaviour for a single-operator box, not for a shared service"}]},{"id":"AUDIT","n":"Audit log","t":"audit.ts · 80 lines · 3 exports","k":"store","col":7,"row":0,"d":"Append-only in practice (there is a DELETE endpoint the operator can call, and nothing else removes rows). Every authentication decision, origin rejection, terminal open and rejected cwd lands here with the IP and user agent.","in":[{"n":"record","t":"AuditEventInput{type,status:\"success\"|\"failure\"|\"info\",username?,ip?,userAgent?,metadata}","l":"one synchronous INSERT per event","s":"audit_events table","d":"metadata is JSON.stringify'd — the URL and method of a rejected request go in there, which is what makes a 403 traceable to an endpoint after the fact"}],"out":[{"n":"list","t":"AuditEvent[] with metadata parsed back","l":"—","s":"—","d":"Exposed at GET /api/auth/audit so the operator can review it in the Security panel without a SQLite client"}]}],"links":[{"s":["CFG",0],"t":["PWD",0],"l":"password | hash"},{"s":["PWD",0],"t":["SESS",0],"l":"verified → create"},{"s":["SESS",0],"t":["REQ",0],"l":"SessionRecord"},{"s":["ORIGIN",0],"t":["AUDIT",0],"l":"origin rejected"},{"s":["RL",0],"t":["AUDIT",0],"l":"rate limited"},{"s":["TOTP",0],"t":["SESS",0],"l":"second factor passed"}]});
dia({"id":"L3-ROUTES","lv":3,"parent":"L2-SERVER","title":"Component · REST surface (routes/ · 12 files / 4327 lines)","sub":"130 endpoints under /api/*, grouped by the resource they own — each module receives its stores as plugin options rather than importing them","colw":248,"blocks":[{"id":"RT-SESSIONS","n":"Sessions & agent profiles","t":"sessions.ts · 1164 lines · 54 endpoints","k":"comp","col":0,"row":0,"d":"The largest route module because it is the surface of the largest subsystem: session CRUD, resume, rename, the session tree, model and thinking-level switching, skill policy, worktree finish, project relocation and move, repository cloning with an SSE progress channel, and the whole agent-profile settings matrix (proxy, API keys, default model, automation model, auto-rename).","in":[{"n":"create session","t":"CreateSessionRequest{clientId,cwd?,modelProvider?,modelId?,enabledSkills?,disabledSkills?,presetId?,copySettingsFromSessionId?,worktree?}","l":"one AgentSession per created session, held until cleanup","s":"session_skill_policies + session_worktrees rows","d":"The skill policy is resolved and PERSISTED at creation; changing skills later requires updateSessionSkillPolicy plus a new AgentSession, because the SDK freezes the resource loader at construction"},{"n":"clone repository","t":"{url, targetName, clientId}","l":"one job at a time per jobId, cancellable","s":"the configured git clone parent (ui.gitCloneParentPath, default ~/git/github)","d":"Progress is delivered over SSE at /clone-repository/:jobId/events rather than the chat socket, so a clone survives a chat reconnect"}],"out":[{"n":"SessionInfo[]","t":"{id,name?,path,created,modified,messageCount,cwd?,firstMessage?,worktree?}","l":"list cache 2,000 ms","s":"—","d":"messageCount counts USER turns only — computed by streaming each JSONL file, memoised on mtimeMs, 10 files at a time"}]},{"id":"RT-GIT","n":"Git operations","t":"git.ts · 696 lines · 3 exports · 13 endpoints","k":"comp","col":1,"row":0,"d":"status / diff / branches / commit / amend / switch-branch, plus LLM-generated commit messages with an operator-editable prompt pair. Every command runs through one runGit() wrapper so the output cap is impossible to bypass by adding an endpoint.","in":[{"n":"git request","t":"{cwd, scope?:\"all\"|\"staged\"|\"unstaged\", args…}","l":"MAX_SLASH_COMMAND_OUTPUT_BYTES = 256 KiB · MAX_STATUS_FILES = 1,000","s":"the operator's repository","d":"Exceeding maxBuffer throws OversizedGitOutputError with an explicit message rather than returning a truncated diff — a half diff is worse than no diff, because the operator would commit against it"},{"n":"commit message prompts","t":"CommitMessagePrompts{systemPrompt?, userPrompt?} scoped by path","l":"one row per scope_path","s":"commit_message_prompts table","d":"Prompts are scoped per repository path, so a monorepo and a personal project can have different commit conventions without a global setting"}],"out":[{"n":"generated message","t":"completeSimple() against the profile's automation model","l":"default anthropic/claude-haiku-4-5","s":"—","d":"A cheap model by default: this runs on every commit button press, and the operator edits the result anyway"}]},{"id":"RT-FILES","n":"Filesystem & editor backend","t":"files.ts · 534 lines · 12 endpoints","k":"comp","col":2,"row":0,"d":"tree / read / write / create / delete / rename / mkdir / search / download / raw / preview-asset / open-system. The MIME allow-lists are the interesting part: preview-asset serves a wider set than image preview, because the HTML preview needs CSS and fonts too, and serving arbitrary types from the operator's disk under the app origin would break the CSP guarantee.","in":[{"n":"path","t":"query/body string, may contain ~","l":"every entry point calls resolveAllowedPath() first","s":"allowed roots (default ~)","d":"This is the single most security-relevant module in the codebase: a missed check here is arbitrary file read AND write as the server user"},{"n":"search","t":"{cwd, query, glob?}","l":"glob-backed; binaryExtensions excluded from content search","s":"—","d":"A 44-entry binary extension set stops the searcher from streaming a .zip or .mp4 into a UTF-8 decoder"}],"out":[{"n":"TreeNode","t":"{name,path,type,isSymlink?,linkTarget?,targetType?,mtime?,children?}","l":"—","s":"—","d":"Symlinks are reported with their target and target TYPE (file/directory/missing/other) rather than followed silently, so the operator can see a dangling link instead of an empty directory"}]},{"id":"RT-HOSTING","n":"GitHub / Gitea hosting","t":"git-hosting.ts · 409 lines · 2 exports · 15 endpoints","k":"comp","col":3,"row":0,"d":"One route module serving two providers behind one interface, registered TWICE — at /api/git-hosting and at the legacy /api/gitea prefix, so older clients keep working. PR and issue bodies are generated by the model with a preview step before anything is created remotely.","in":[{"n":"create PR","t":"{owner,repo,head,base,title,body}","l":"one per action","s":"github.token / gitea.token in security_settings","d":"pr/preview and pr/generate exist separately from pr/create precisely so a generated body is never posted without the operator seeing it"}],"out":[{"n":"activity row","t":"SessionActivityRecord{kind:\"pr_created\", data:{owner,repo,number,url,provider}}","l":"one row per PR","s":"session_builtin_events table","d":"The row is what lets the chat transcript show a PR badge later, and what refreshPullRequestStatus() re-polls to flip it to \"merged\""}]},{"id":"RT-MEM","n":"Memory management","t":"memories.ts · 392 lines · 13 endpoints","k":"comp","col":4,"row":0,"d":"The Memory Center's backend: list, counts, create, patch, delete, approve/reject/restore, plus extraction-run control (enqueue, retry, clear, list failed) and batch undo. The approve/reject pair exists because global-scope memories are created as 'pending' — an automatic extraction may not silently write a rule that applies to every project.","in":[{"n":"review action","t":"POST /:id/approve | /:id/reject | /:id/restore","l":"—","s":"memories.status ∈ active|pending|archived","d":"Reject archives rather than deletes, so a wrongly-rejected memory is recoverable via /restore"},{"n":"batch undo","t":"POST /batches/:id/undo","l":"one extraction run per batch","s":"memories.extraction_run_id","d":"A whole extraction run can be reverted as a unit — the run id is denormalised onto each memory precisely to make that one statement"}],"out":[{"n":"counts","t":"{activeProject, pendingGlobal, failedRuns}","l":"—","s":"—","d":"Drives the badge on the Memory button; the same numbers arrive push-style over the chat socket as memory_updated, so the badge does not need polling"}]},{"id":"RT-TASKS","n":"Task queue","t":"tasks.ts · 236 lines · 2 exports · 8 endpoints","k":"comp","col":5,"row":0,"d":"A per-project queue of prompts to run later, each carrying its full launch configuration (profile, model, skill policy or preset, worktree options). /polish sends the draft prompt to the automation model to tighten it before it is queued.","in":[{"n":"start task","t":"POST /:id/start {clientId}","l":"status transitions waiting→starting→started→completed","s":"project_tasks table","d":"claimStart() is the concurrency guard: it moves the row to 'starting' in one statement, so two browser tabs cannot launch the same task twice"},{"n":"restore on boot","t":"restoreAllStarting()","l":"runs once in buildApp()","s":"—","d":"A crash mid-launch leaves rows stuck in 'starting' forever; resetting them at boot is what makes the queue self-healing"}],"out":[{"n":"ProjectTaskStartResult","t":"{task, sessionId, prompt, model, thinkingLevel, worktree?}","l":"—","s":"—","d":"The prompt is returned rather than sent: the CLIENT submits it over the chat socket, so the task's first turn streams into the normal chat UI"}]},{"id":"RT-AUTH","n":"Auth, preferences & skill presets","t":"auth.ts · 388 lines · 14 endpoints","k":"comp","col":6,"row":0,"d":"The only public /api prefix. Also hosts preferences and skill presets, because both are per-account data keyed by the same username and there is exactly one account.","in":[{"n":"login","t":"{username, password, code?}","l":"5 failures / 15 min / IP, checked before scrypt","s":"audit_events","d":"On success the rate-limit entry is cleared, the audit row is written, and the cookie is set in one handler — the order matters only in that the cookie is set last, after every check has passed"}],"out":[{"n":"skill preset","t":"SkillPresetRecord{id,username,name,mode:\"enabled\"|\"disabled\",skills[]}","l":"UNIQUE(username, name)","s":"skill_presets table","d":"session_skill_policies references it with ON DELETE SET NULL — deleting a preset must not cascade away a running session's policy"}]},{"id":"RT-GW","n":"Gateway endpoints","t":"gateways.ts + feishu-gateway.ts · 2 files / 62 lines","k":"comp","col":7,"row":0,"d":"Configuration for both IM gateways plus the WeChat pairing flow — and one deliberately PUBLIC endpoint: POST /api/gateways/feishu/events, the Feishu webhook, which cannot carry a session cookie and authenticates by verification token and AES-decryptable envelope instead.","in":[{"n":"Feishu event","t":"encrypted envelope → AES-CBC decrypt with sha256(encryptKey)","l":"deduped by event_id for DEDUP_TTL_MS = 24 h","s":"feishu_gateway_sessions","d":"This is the one hole in the \"everything under /api is authenticated\" rule, which is why it is listed explicitly in isPublicRoute() rather than matched by a prefix"},{"n":"WeChat pairing","t":"POST /weixin/pairing","l":"QR expires per the upstream ilinkai response","s":"weixin_gateway_credentials","d":"Pairing state is polled by the browser via GET /weixin/pairing because the confirmation happens on the phone, out of band"}],"out":[{"n":"gateway settings","t":"{enabled, cwdChoices[], agentProfile?, modelProvider?, modelId?, skillMode?, skillPresetId?, dmPolicy, allowedUsers[]}","l":"—","s":"security_settings gateway.* keys","d":"cwdChoices being empty is a hard stop, not a warning: both gateways refuse to open a session and reply with GATEWAY_FOLDERS_REQUIRED_MESSAGE"}]},{"id":"RT-MISC","n":"Review sources, slash commands, changelog","t":"review-sources.ts + slash-commands.ts + changelog.ts · 3 files / 446 lines","k":"comp","col":8,"row":0,"d":"Read-mostly surfaces. Review sources let the operator browse transcripts produced by OTHER agents (Claude Code, Codex, Devin) through a common adapter interface — this app as a reading room for sessions it did not create.","in":[{"n":"list transcripts","t":"{sourceId, projectPath?, offset?, limit?}","l":"paged","s":"the adapter's own data path (e.g. ~/.claude/projects)","d":"Capabilities are declared per source (canDeleteSource, canDeleteSessions) because deleting another tool's session file is only sometimes appropriate"}],"out":[{"n":"ReviewSessionTranscript","t":"{messages:[{role,content,timestamp?,detailOnly?}], metadata?}","l":"—","s":"—","d":"detailOnly marks entries the reader should collapse — each adapter decides what counts as noise in its own format"}]}],"links":[{"s":["RT-SESSIONS",0],"t":["RT-TASKS",0],"l":"task launch → session"},{"s":["RT-TASKS",0],"t":["RT-HOSTING",0],"l":"task → issue"},{"s":["RT-GIT",0],"t":["RT-HOSTING",1],"l":"commit → PR"},{"s":["RT-GW",0],"t":["RT-SESSIONS",0],"l":"chat message → session"}]});
dia({"id":"L3-WS","lv":3,"parent":"L2-SERVER","title":"Component · WebSocket handlers (ws/ · 3 files / 529 lines)","sub":"Two sockets, two lifetimes: the chat socket outlives sessions, the terminal socket IS the pty's lifetime","colw":262,"blocks":[{"id":"CHAT","n":"Chat socket","t":"chat.ts · 404 lines · 1 exports","k":"app","col":0,"row":0,"d":"One socket per browser tab, keyed by clientId, carrying four inbound message types and eight outbound ones. It does three things nothing else does: it resolves which AgentSession a prompt targets (resuming from disk if needed), it detects tool loops, and it decides what happens when a tab disappears mid-stream.","in":[{"n":"prompt","t":"WSMessage{type:\"prompt\",payload:{text,sessionId?,requestId?,images?}}","l":"≤4 images, ≤10 MiB each; text unbounded","s":"uploaded images → <cwd>/tmp/upload_images/","d":"Images are written to the project as real files and their PATHS appended to the prompt, so the agent can re-open them with its own read tool later in the conversation instead of only seeing them once"},{"n":"abort","t":"WSMessage{type:\"abort\",payload:{sessionId?}}","l":"ABORT_GRACE_MS = 5,000","s":"—","d":"abort() races a 5-second timer; on timeout the AgentSession is force-disposed, because a runtime that will not stop would otherwise hold isStreaming true forever and lock the UI"},{"n":"socket close","t":"—","l":"cleanup scheduled 5 min later","s":"—","d":"A closed tab does NOT dispose immediately: scheduleCleanup(clientId, 5 min) gives a reload time to reclaim the same session, while a genuinely gone tab frees its AgentSession"}],"out":[{"n":"event frame","t":"{type:\"event\", sessionId, event:AgentSessionEvent}","l":"one per SDK event","s":"—","d":"sendJson never throws — delivery failure must not propagate into the agent run"},{"n":"prompt_preflight","t":"{type:\"prompt_preflight\",sessionId,requestId,accepted,code?,message?,imagePaths?}","l":"one per requestId","s":"—","d":"This is the only acknowledgement the client gets that a prompt was accepted; the client holds the user's bubble in a pending state for up to 30 s waiting for it"},{"n":"loop_detected","t":"{type:\"loop_detected\",sessionId,message,toolName}","l":"MAX_REPEATED_TOOL_CALLS = 3","s":"—","d":"Three consecutive tool calls with an IDENTICAL name and identical JSON args abort the run — the history array is trimmed to 3× that to stay bounded on long sessions"}]},{"id":"TERM","n":"Terminal socket","t":"terminal.ts · 109 lines · 1 exports","k":"app","col":1,"row":0,"d":"One socket = one pty, and that identity is the whole safety argument. The handler captures its own terminal.id in a closure, so the close handler can only ever kill the pty it created — disposeByClient() exists on the manager but is deliberately not used here, since one clientId may have several terminals open.","in":[{"n":"open","t":"GET /ws/terminal?clientId=&cwd=","l":"one pty per connection, spawned at 80×24","s":"resolveAllowedPath(cwd) or process.cwd()","d":"A rejected cwd closes the socket with an explicit message and records terminal_cwd_rejected — the pty is never spawned, so there is nothing to clean up"},{"n":"input / resize","t":"{type:\"input\",terminalId,data} · {type:\"resize\",terminalId,cols,rows}","l":"terminalId must equal this connection's pty","s":"—","d":"The terminalId is checked against the closure's own id on every frame: a client cannot address another connection's pty by guessing its id"}],"out":[{"n":"output / exit","t":"{type:\"output\"|\"exit\"|\"created\", terminalId, data|exitCode|shell}","l":"streamed per pty chunk","s":"—","d":"Shell selection is PI_WEBUI_TERMINAL_SHELL → COMSPEC on win32 → $SHELL → bash: bash is not guaranteed to exist on Windows, and spawning a missing shell would fail after the socket already reported success"}]},{"id":"SAFE","n":"Safe send","t":"safe-send.ts · 16 lines · 1 exports","k":"lib","col":2,"row":0,"d":"Sixteen lines that exist because of one bug class: a WebSocket can close between the readyState check and the send() call, and an exception there would propagate out of an SDK event callback and kill a running agent turn.","in":[{"n":"message","t":"unknown, JSON-stringified at the boundary","l":"—","s":"—","d":"Non-serialisable values throw inside the try and are swallowed like a closed socket — a malformed frame is dropped, not crashed on"}],"out":[{"n":"delivered or dropped","t":"void","l":"—","s":"—","d":"Deliberately returns nothing: the caller must not be able to branch on delivery, because retrying into a closed socket is never the right answer here"}]}],"links":[{"s":["CHAT",0],"t":["SAFE",0],"l":"every outbound frame"},{"s":["TERM",0],"t":["SAFE",0],"l":"(terminal sends raw — see note)"}]});
dia({"id":"L3-SERVICES","lv":3,"parent":"L2-SERVER","title":"Component · Privileged services (services/ · 32 files / 7120 lines)","sub":"Grouped by the resource each one owns; the process-wide proxy context is drawn one level up because it is not owned by any of them","colw":250,"blocks":[{"id":"SESSIONSVC","n":"Pi session service","t":"session-manager.ts + policy/activity stores · 5 files / 1964 lines","k":"app","col":0,"row":0,"d":"The single largest source file in the server (1964 lines across this group, session-manager.ts alone is 1,451). It holds four Maps that together ARE the server's runtime state: sessions by sessionId, sessionIds by clientId, the current session per client, and the pending cleanup timers. Everything else in the server ultimately asks this object whether a session exists.","in":[{"n":"createSession","t":"(clientId, SessionOptions{cwd?,modelProvider?,modelId?,enabledSkills?,disabledSkills?,presetId?,skillMode?,noSession?,memoryEnabled?})","l":"one AgentSession per sessionId; unbounded count","s":"~/.pi/<profileId>/projects/<slug>/<sessionId>.jsonl","d":"The tool set is fixed at read·bash·edit·write·grep·find·ls, plus 'memory' only when a memory runtime exists AND the session is persistent — an in-memory session has nothing to extract from"},{"n":"scheduleCleanup","t":"(clientId, delayMs = 5 × 60 × 1000)","l":"one timer per clientId","s":"—","d":"5 minutes is the reload grace window; cancelCleanup() is called on the next prompt, so an active operator never trips it"},{"n":"listSessions","t":"(clientId, projectPath?)","l":"cache TTL 2,000 ms · 10 JSONL readers concurrently","s":"—","d":"The cache holds the in-flight PROMISE, not just the result, so ten simultaneous sidebar renders do one directory walk between them"}],"out":[{"n":"AgentSession","t":"the SDK object, subscribable","l":"one per sessionId, shared across clientIds if resumed twice","s":"—","d":"resumeSession() checks for an existing instance by sessionId and DISPOSES the freshly built one rather than returning it — two live AgentSessions over one JSONL file would interleave writes"},{"n":"SessionRuntimeStatus","t":"{model{provider,id,contextWindow,reasoning,input[]}, thinkingLevel, usingSubscription, autoCompactionEnabled, stats{tokens{input,output,cacheRead,cacheWrite,total},cost}, contextUsage{tokens,contextWindow,percent}}","l":"read on demand","s":"—","d":"contextUsage.tokens is nullable: right after a compaction the SDK has not recounted yet, and showing 0% would be worse than showing \"recalculating\""}]},{"id":"WORKTREE","n":"Git worktree management","t":"worktree-manager.ts + worktree-metadata-store.ts · 2 files / 292 lines","k":"comp","col":1,"row":0,"d":"Lets one session run in its own branch and directory without disturbing the operator's checkout. Branch names are validated before they ever reach the git command line — the assertSafeBranchName guard is the only thing between a chat-supplied branch name and argument injection.","in":[{"n":"resolveSessionCwd","t":"(projectPath, CreateSessionWorktreeOptions{mode:\"none\"} | {mode:\"managed\",branchMode:\"new\",branchName,baseBranch,copyFile?} | {mode:\"managed\",branchMode:\"existing\",branchName,copyFile?})","l":"one worktree per branch; reused if git already has one","s":"<repo>/../<repo>-worktrees/<branch> style managed path","d":"An existing worktree for that branch is REUSED rather than re-added — git refuses a second worktree on one branch, and failing there would abort session creation"},{"n":"copyFile","t":"a root-level gitignored filename (e.g. .env)","l":"one file per worktree creation","s":"—","d":"Only files that are BOTH at the repo root and actually gitignored are offered — the point is carrying local secrets into the worktree, not copying tracked files"}],"out":[{"n":"SessionWorktreeInfo","t":"{sessionId,baseRepoPath,worktreePath,branchName,branchMode,baseBranch?,worktreeManaged:true,worktreeStatus:\"active\"|\"finished\",createdAt,updatedAt,finishedAt?}","l":"one row per session","s":"session_worktrees table (indexed on base_repo_path)","d":"The base_repo_path index exists so memory can resolve a worktree session back to its PARENT project — memories must not fragment per branch"}]},{"id":"TASKSVC","n":"Task queue & skill presets","t":"project-task-store.ts + project-task-starter.ts + skill-preset-store.ts · 3 files / 610 lines","k":"comp","col":2,"row":0,"d":"The queue stores a complete launch recipe per task, and the starter is the transaction: claim → validate → resolve worktree → create session → mark started, with a compensating restoreWaiting() if anything before session creation fails.","in":[{"n":"start","t":"(taskId, clientId)","l":"claimStart() is a single-statement status transition","s":"project_tasks.status ∈ waiting|starting|started|completed","d":"The compensation is asymmetric on purpose: once the session EXISTS the task stays in 'starting' rather than reverting, because reverting would let a second start create a second session for one task"},{"n":"preset resolution","t":"presetId → SkillPresetRecord","l":"—","s":"skill_presets table","d":"A preset deleted between queueing and starting degrades to mode:\"enabled\" with an empty skill list rather than failing the launch — the task still runs, just with no skills"}],"out":[{"n":"validated launch","t":"{profileId exists, model available for that profile, every named skill present in that cwd}","l":"three lookups before any session is built","s":"—","d":"Validating skills against the PROJECT PATH matters: a skill can exist for one profile and not another, and a task queued weeks ago may name one that has since been removed"}]},{"id":"GITSVC","n":"Git hosting clients & settings","t":"git-hosting + gitea/github clients + settings stores + repository-cloner · 7 files / 965 lines","k":"comp","col":3,"row":0,"d":"Two provider clients behind one shape, their credential stores, and the cloner. Credentials live in security_settings rather than the environment specifically so they can be entered and rotated from the browser without a restart.","in":[{"n":"provider settings","t":"{serverUrl, token, proxyUrl?}","l":"one row per key in security_settings","s":"security_settings: gitea.serverUrl/token · github.serverUrl/token/proxyUrl","d":"GitHub gets its own proxy setting separate from the agent profile proxy, because reaching github.com and reaching a model API are frequently different network paths"},{"n":"clone","t":"{url, targetName, clientId}","l":"one cancellable job; progress over SSE","s":"ui.gitCloneParentPath, default ~/git/github","d":"The clone runs under the CLIENT's agent-profile proxy merged with the GitHub proxy — cloning through the wrong proxy is a common failure this merge is designed to avoid"}],"out":[{"n":"pull request","t":"{number, url, merged}","l":"—","s":"session_builtin_events","d":"getPullRequestStatus() is re-polled on read so a PR merged outside the UI is reflected without a webhook"}]},{"id":"GATEWAYSVC","n":"IM gateways","t":"weixin-gateway.ts + feishu-gateway.ts + shared alias/settings · 6 files / 2184 lines","k":"risk","col":4,"row":0,"d":"RISK — weixin-gateway.ts is 1,280 lines in one file and cannot be split by theme: it is simultaneously a long-poll client, a QR pairing state machine, an image download-and-decrypt pipeline, a typing-indicator keepalive, a command parser and a session mapper against an undocumented endpoint (ilinkai.weixin.qq.com). Feishu is 688 lines doing the webhook equivalent. Both must map a chat thread to a Pi session and enforce the allowed-folder list.","in":[{"n":"WeChat long poll","t":"ilink protocol, item types 1=text 2=image 3=voice","l":"LONG_POLL_TIMEOUT_MS = 35,000 · API_TIMEOUT_MS = 15,000 · dedup 5 min","s":"weixin_gateway_sessions/configs/state/context_token/credential tables","d":"Five tables are created by this one service at runtime rather than in db/database.ts — a deliberate split so a user who never enables WeChat carries no unused schema"},{"n":"Feishu webhook","t":"AES-CBC envelope, key = sha256(encryptKey)","l":"dedup by event_id for 24 h","s":"feishu_gateway_sessions/configs","d":"Feishu redelivers aggressively on a slow ack; 24 h of dedup state is the cost of not double-answering a message"},{"n":"command text","t":"normalizeGatewayCommandText(raw)","l":"alias tables for new-session / status / help, prefix \"小助理\"","s":"—","d":"Chinese and English aliases are matched by table rather than regex-per-site, so both gateways answer the same words"}],"out":[{"n":"reply + typing","t":"text bubble; typing ping every TYPING_KEEPALIVE_INTERVAL_MS = 5,000","l":"cancelled explicitly on completion","s":"—","d":"If the process dies mid-run the chat app is left showing \"typing\" until its own timeout — there is no server-side cancel on crash"}]},{"id":"REVIEWSVC","n":"Review-source adapters","t":"review-source-* + adapters/ · 6 files / 903 lines","k":"comp","col":5,"row":0,"d":"Read-only importers for other agents' transcripts: Claude Code, Codex and Devin, each behind ReviewSourceAdapter. The interface is five methods wide (list, search, getTranscript, delete, listProjectPaths) and deliberately no wider — anything richer would not survive a third format.","in":[{"n":"source registration","t":"CreateReviewSourceRequest{type,label,dataPath}","l":"one row per configured source","s":"review_sources table","d":"dataPath is per-source because each tool stores transcripts somewhere different; the default is supplied by the provider registry, not hard-coded in the route"}],"out":[{"n":"ReviewSessionListItem[]","t":"{id,sourceId,name?,path,cwd?,created,modified,messageCount,firstMessage?}","l":"paged by {offset, limit}","s":"—","d":"Deliberately the same shape as SessionInfo so the sidebar can render both kinds of session with one component"}]},{"id":"IOSVC","n":"Terminal, image input & uploads","t":"terminal-manager.ts + image-input.ts + uploaded-image-store.ts · 3 files / 202 lines","k":"comp","col":6,"row":0,"d":"Three small owners of foreign data. image-input.ts is the validation gate for anything a user or a chat app attaches; uploaded-image-store writes the accepted bytes into the project so the agent can reach them by path.","in":[{"n":"images","t":"ImageContent[] {type:\"image\",data:base64,mimeType,name?}","l":"MAX_IMAGE_COUNT = 4 · MAX_IMAGE_BYTES = 10 MiB · MIME ∈ png|jpeg|webp|gif","s":"<cwd>/tmp/upload_images/","d":"Validation also checks the SESSION'S MODEL: a model whose input capabilities exclude images rejects the prompt at preflight rather than after the tokens are spent"},{"n":"pty create","t":"(clientId, cwd)","l":"one entry in a process-wide Map<string, TerminalSession>","s":"a real pseudo-terminal","d":"The id is `term-${Date.now()}-${random}` — collision-safe in practice, but the Map is never swept: a pty whose socket vanished without a close event stays until the process exits"}],"out":[{"n":"saved paths","t":"string[] absolute paths appended to the prompt as an \"[Uploaded image files]\" note","l":"one directory per project cwd","s":"<cwd>/tmp/upload_images/","d":"Files are left behind deliberately — the agent may be asked about them many turns later, so nothing garbage-collects them"}]}],"links":[{"s":["TASKSVC",0],"t":["WORKTREE",0],"l":"resolveSessionCwd"},{"s":["WORKTREE",0],"t":["SESSIONSVC",0],"l":"cwd + metadata"},{"s":["TASKSVC",0],"t":["SESSIONSVC",0],"l":"createSession"},{"s":["GATEWAYSVC",0],"t":["SESSIONSVC",0],"l":"chat → session"},{"s":["IOSVC",0],"t":["SESSIONSVC",0],"l":"validated images"},{"s":["GITSVC",0],"t":["WORKTREE",0],"l":"branch → PR head"}]});
dia({"id":"L3-MEMORY","lv":3,"parent":"L2-SERVER","title":"Component · Durable memory (memory/ · 19 files / 4337 lines)","sub":"The only subsystem that spends model tokens the operator did not ask for — so every stage is versioned, budgeted and yields to the foreground","colw":250,"blocks":[{"id":"MEMRUNTIME","n":"Runtime & extraction queue","t":"runtime.ts + coordinator.ts + policy.ts + project-resolver.ts · 4 files / 294 lines","k":"app","col":0,"row":0,"d":"The scheduler. Per agent profile it keeps one drain loop, one AbortController and a foreground counter — and the whole point is the counter: withForeground() aborts the running extraction, waits for the drain to settle, runs the operator's turn, then kicks the queue again. Background learning must never compete with the conversation for the same proxy context.","in":[{"n":"enqueue","t":"EnqueueExtractionRunInput{profileId,projectId,sourceSessionId,sourceSessionPath,sourceKind:\"automatic\"|\"session_import\",startingLeafId?,endingLeafId,modelProvider?,modelId?}","l":"UNIQUE(source_session_id, ending_leaf_id, source_kind)","s":"memory_extraction_runs table","d":"Queue state lives in SQLite, not memory: recoverInterruptedRuns() at start() is what makes a crash mid-extraction resumable instead of lost"},{"n":"withForeground","t":"(profileId, work)","l":"one foreground scope may nest; count > 0 blocks every kick","s":"—","d":"A requeue caused by foreground preemption is marked differently from a retry, so a busy operator does not burn the 2-attempt retry budget"}],"out":[{"n":"project resolution","t":"MemoryProject{id, profileId, canonicalPath}","l":"UNIQUE(profile_id, canonical_path)","s":"memory_projects table","d":"A worktree session resolves to its BASE repo path, not the worktree — otherwise every feature branch would accumulate its own disjoint memory"},{"n":"memory_updated","t":"{profileId,projectId,extractionRunId,activeProjectCount,pendingGlobalCount,failed}","l":"one per completed or failed run","s":"—","d":"Emitted on an EventEmitter the chat sockets subscribe to; each socket filters by its own client's active profile before forwarding"}]},{"id":"MEMEXT","n":"Agent extension","t":"extension.ts · 221 lines · 1 exports","k":"comp","col":1,"row":0,"d":"The seam into the Pi SDK. It hooks three lifecycle events and registers one tool. The leaf-id bookkeeping is the subtle part: baselineLeafId tracks where the last extraction ended, so each run only ever reads the NEW branch of the session tree.","in":[{"n":"before_agent_start","t":"{prompt, systemPrompt}","l":"budget decided per prompt","s":"—","d":"A recall failure is caught, logged, and reported as a recall event with skipReason \"recall-error\" — the turn proceeds with the original system prompt"},{"n":"agent_settled","t":"ctx.sessionManager.getLeafId()","l":"skipped when endingLeafId === baselineLeafId","s":"—","d":"An unchanged leaf means nothing new was said — the guard is what stops an aborted or empty turn from queueing an extraction"},{"n":"memory tool call","t":"{operation:\"save\"|\"search\"|\"update\"|\"forget\", id?,query?,content?,scope?,category?,tags?,pinned?,pinnedApplicability?,expectedRevision?}","l":"executionMode:\"sequential\"","s":"memories table","d":"update and forget REQUIRE expectedRevision — optimistic concurrency, because the operator can edit the same memory in the Memory Center while the agent holds a stale copy"}],"out":[{"n":"system prompt injection","t":"`${systemPrompt}\\n\\n${recall.prompt}`","l":"only when recall.prompt is non-empty","s":"—","d":"The tool description tells the model to use mutations ONLY on explicit user request — automatic learning is the coordinator's job, and letting the model also save opportunistically would double-write"}]},{"id":"MEMRECALL","n":"Recall ranking & budget","t":"recall.ts + legacy-recall.ts · 2 files / 444 lines · 25 exports","k":"comp","col":2,"row":0,"d":"The scoring engine, and the most opinionated file in the repository. It classifies the prompt's intent, extracts entities (paths, symbols, commands, error ids, quoted phrases, Chinese n-grams), scores every candidate, then selects a DIVERSE subset under a token budget. Versioned as adaptive-lexical-v1 so a recall event recorded today can be interpreted after the policy changes.","in":[{"n":"query","t":"the raw user prompt","l":"MAX_RECALL_CANDIDATES = 24 terms · FTS query capped at 16 phrases","s":"memory_fts (fts5, unicode61)","d":"Chinese is tokenised into 2- and 3-grams because unicode61 does not word-segment CJK — without this, Chinese memories are only ever found by exact substring"},{"n":"candidates","t":"MemoryRecord[] from FTS + pinned","l":"—","s":"memories table","d":"MIN_RECALL_SCORE = 0.75 and STRONG_RECALL_SCORE = 1 are the two thresholds that separate \"worth tokens\" from \"noise\""}],"out":[{"n":"selection","t":"DiverseMemorySelection{selected, rejectedBelowThresholdIds, redundancyRejectedIds, budgetRejectedIds, usedTokens}","l":"budget 0 | 400 | 800 | 1,500 | 2,500 tokens by strong-match count and explicit inspection","s":"memory_recall_events table","d":"Two candidates over 0.72 Jaccard similarity are treated as redundant and the weaker is dropped — near-duplicate memories otherwise crowd out the whole budget"},{"n":"prompt block","t":"markdown \"- [category] content\" bullets, < > & escaped","l":"—","s":"—","d":"Escaping matters because memory content is model-authored text being re-injected into a system prompt — unescaped angle brackets there are a prompt-injection surface"}]},{"id":"MEMEXTRACT","n":"Extraction pipeline","t":"extractor.ts + extraction-{format,gate,provider,query}.ts + legacy-extraction.ts · 6 files / 1350 lines · 31 exports","k":"comp","col":3,"row":0,"d":"Turns a settled turn into candidate memories, with a cheap regex gate in front of the expensive model call. The gate is the cost control: most turns are acknowledgements or one-off tasks and are skipped without spending a token.","in":[{"n":"branch entries","t":"SessionEntry[] between startingLeafId and endingLeafId","l":"MAX_EXTRACTION_EVIDENCE_RECORDS = 64","s":"the session JSONL file","d":"Evidence is referenced by short ids (e1, e2…) in the prompt and never re-quoted in the output, which is what keeps candidates under 220 characters"},{"n":"gate decision","t":"evaluateDurableSignal(source) → {decision, reasonCode}","l":"9 reason codes, 6 bilingual regexes","s":"memory_extraction_runs.gate_decision / gate_reason_code","d":"Durable language, corrections, decisions and confirmed outcomes extract; empty, tool-only, acknowledgement and transient-task skip; anything else is \"ambiguous\" and extracts — the gate fails OPEN because a missed memory is worse than a wasted call"},{"n":"model call","t":"complete({maxTokens:4096, structuredOutput}) under the profile's proxy","l":"EXTRACTION_TIMEOUT_MS = 45,000 · ≤2 attempts for transport/schema errors","s":"—","d":"Only anthropic/google/google-vertex/openai use native JSON schema; everyone else gets prompt-JSON, because an unverified provider silently ignoring the schema produces garbage that looks valid"}],"out":[{"n":"validated candidates","t":"ValidatedExtractionCandidate{operation:\"new\"|\"duplicate\"|\"replace\", scope, category, content, tags, evidenceIds, existingMemoryId}","l":"≤8 candidates · content ≤220 chars · ≤4 tags of ≤24 chars · 1–4 evidence ids","s":"—","d":"Everything outside those bounds is DISCARDED and counted in discarded_count rather than truncated — a clipped memory is a false memory"}]},{"id":"MEMSTORE","n":"Store, service & validation","t":"store.ts + service.ts + validation.ts + types.ts · 4 files / 1758 lines · 43 exports","k":"store","col":4,"row":0,"d":"store.ts is 1,016 lines of SQL: memories, projects, extraction runs, recall events, the FTS mirror and every state transition. validation.ts is 37 lines and matters more — it is the last gate before content becomes durable.","in":[{"n":"candidate content","t":"string","l":"MAX_MEMORY_CONTENT_LENGTH = 2,000 · MAX_MEMORY_TAGS = 10 · MAX_MEMORY_TAG_LENGTH = 32","s":"memories table","d":"Four SECRET_PATTERNS (PEM private keys, sk-/rk- keys, gh[pousr]_ tokens, password/api_key/token assignments) throw rather than store — a model that quotes a credential into a memory would otherwise re-inject it into every future system prompt"},{"n":"dedup key","t":"sha256(normalized lowercase content)","l":"UNIQUE(profile_id, IFNULL(project_id,''), scope, content_hash) WHERE status IN (active,pending)","s":"memories_live_hash_idx","d":"The partial index is why an ARCHIVED memory does not block re-learning the same fact later"}],"out":[{"n":"MemoryRecord","t":"{id,profileId,projectId?,scope,category,content,tags,pinned,pinnedApplicability,status,source,revision,useCount,positiveUtilityCount,negativeUtilityCount,…}","l":"—","s":"memories + memory_fts kept in sync by 3 triggers","d":"revision is what expectedRevision compares against; the FTS mirror is trigger-maintained so no code path can insert a memory without indexing it"}]},{"id":"MEMEVAL","n":"Recall evaluation harness","t":"evaluation/ · 2 files / 270 lines · 4 exports","k":"note","col":5,"row":0,"d":"An offline scorer with a fixture set (fixtures/v1.json), run by `pnpm memory:eval`. It exists because the recall thresholds — 0.75, 0.72, the budget ladder — are empirical, and changing one without a measurement is guesswork.","in":[{"n":"fixture","t":"{prompt, memories[], expectedSelectedIds[]}","l":"one JSON file, versioned v1","s":"server/src/memory/evaluation/fixtures/v1.json","d":"The fixtures are versioned alongside RECALL_POLICY_VERSION so a policy change and its expected outcomes move together"}],"out":[{"n":"score report","t":"precision/recall per fixture, printed","l":"—","s":"stdout","d":"Not wired into CI — it is a tool the author runs when tuning, which is worth knowing before trusting it as a regression gate"}]}],"links":[{"s":["MEMEXT",0],"t":["MEMRUNTIME",0],"l":"enqueue on agent_settled"},{"s":["MEMRUNTIME",0],"t":["MEMEXTRACT",0],"l":"claimed run"},{"s":["MEMEXTRACT",0],"t":["MEMSTORE",0],"l":"validated candidates"},{"s":["MEMSTORE",0],"t":["MEMRECALL",1],"l":"FTS candidates"},{"s":["MEMRECALL",1],"t":["MEMEXT",0],"l":"prompt block"},{"s":["MEMRECALL",0],"t":["MEMEVAL",0],"l":"scored offline"}]});
dia({"id":"L3-COMPONENTS","lv":3,"parent":"L2-CLIENT","title":"Component · Panels & dialogs (components/ · 28 files / 25208 lines / 1423 script bindings)","sub":"Six files carry 60% of the bindings; each of those gets a rectangle of its own because no theme can split them","colw":236,"blocks":[{"id":"CHATPANEL","n":"ChatPanel.vue","t":"4427 lines · 273 bindings","k":"risk","col":0,"row":0,"d":"RISK — the largest file in the repository (4427 lines, 273 bindings) and it cannot be split by theme because it is one interaction surface. It is at once the message list with virtualised scrolling, the composer with a drag-resize handle, the image paste/drop pipeline, the slash-command and file-mention menus, the skill picker, the plan report viewer, the memory-recall inspector, the session activity badges, and the streaming/steer/follow-up state machine. Splitting it means first extracting a composer component with its own state, which today lives entirely in these bindings.","in":[{"n":"session state","t":"SessionChatState{messages,isStreaming,currentMessage,pendingMemoryRecall} from useChat()","l":"one state object per session the tab has opened","s":"—","d":"The panel reads the state for the VIEWED session, which may differ from the STREAMING session — that split is why a background run keeps appending while the operator reads another conversation"},{"n":"paste / drop","t":"File[] → base64 ChatImage[]","l":"≤4 images, ≤10 MiB each, png|jpeg|webp|gif","s":"—","d":"Client-side limits mirror the server's exactly so a rejection is shown before the upload, not after 10 MiB has crossed the socket"}],"out":[{"n":"send","t":"sendMessage(text, sessionId, {images?, awaitAcceptance?, acceptanceTimeoutMs?, onRejected?})","l":"preflight timeout 30,000 ms","s":"—","d":"With awaitAcceptance the user bubble is rendered immediately but held pending until prompt_preflight arrives; a 30-second silence settles it as rejected rather than leaving it hanging"},{"n":"steer / follow-up","t":"{typ
